<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>NEMU 試作 月明かりの水面 自然な細かさ版</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
  #dbg{position:fixed;left:8px;top:8px;color:#9cf;font:12px/1.4 monospace;white-space:pre;pointer-events:none;z-index:9}
  #start{position:fixed;left:0;right:0;bottom:16vh;text-align:center;color:rgba(255,214,170,.55);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Noto Sans JP",sans-serif;
    font-size:15px;letter-spacing:.12em;transition:opacity 2.5s ease;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="start" lang="ja">画面に触れてはじめる</div>
<div id="dbg"></div>
<script>
(function(){
  "use strict";
  var P = new URLSearchParams(location.search);
  var SESSION = parseFloat(P.get("min") || "15") * 60;
  var CAPTURE = P.get("capture") === "1";   // 確認用:時刻を進めて1コマずつ描く
  var TEST    = P.get("test") === "1";      // 確認用:触れずにマイクを始める

  // ===== 息を拾う =====
  var Sensor = {
    on:false, level:0, floor:0, peak:0, env:0, snr:1, hist:[], acc:0, period:0, conf:0, sinceEst:0, status:"未開始",
    start:function(){                // 画面に触れた瞬間に呼ぶ(iPhoneは触れた瞬間でないと音の処理を始められない)
      var self=this;
      var AC=window.AudioContext||window.webkitAudioContext;
      if(!AC||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ self.status="非対応"; return Promise.resolve(false); }
      var ctx=new AC(); self.ctx=ctx; if(ctx.resume) ctx.resume();
      self.status="許可待ち";
      return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(function(stream){
        self.stream=stream;
        var src=ctx.createMediaStreamSource(stream);
        var hp=ctx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=150;
        var lp=ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=3000;
        var an=ctx.createAnalyser(); an.fftSize=1024;
        src.connect(hp); hp.connect(lp); lp.connect(an);
        self.an=an; self.buf=new Float32Array(an.fftSize); self.on=true; self.status="使用中";
        if(ctx.state!=="running") ctx.resume();
        return true;
      }).catch(function(err){ self.status="使えない("+(err&&err.name||"")+")"; return false; });
    },
    rms:function(){ this.an.getFloatTimeDomainData(this.buf); var s=0,b=this.buf; for(var i=0;i<b.length;i++) s+=b[i]*b[i]; return Math.sqrt(s/b.length); },
    feed:function(r, dt){            // r: いまの音の強さ(実機ではマイク、確認時は疑似の息)
      if(this.floor===0){ this.floor=r; this.peak=r*2+1e-6; this.level=r; }
      this.level += (r-this.level)*Math.min(1,dt/0.12);
      var L=this.level;
      if(L<this.floor) this.floor=L; else this.floor += (L-this.floor)*Math.min(1,dt/25);
      if(L>this.peak) this.peak=L; else this.peak += (L-this.peak)*Math.min(1,dt/12);
      if(this.peak<this.floor*1.6) this.peak=this.floor*1.6;
      var e=(L-this.floor)/(this.peak-this.floor); this.env=Math.max(0,Math.min(1,e));
      this.snr=this.peak/Math.max(this.floor,1e-7);   // 息の音が部屋の静けさの何倍あるか
      this.acc+=dt; while(this.acc>=0.1){ this.acc-=0.1; this.hist.push(this.env); if(this.hist.length>400) this.hist.shift(); }
      this.sinceEst+=dt; if(this.sinceEst>=1){ this.sinceEst=0; this.estimate(); }
    },
    estimate:function(){             // 波の繰り返しから、呼吸1回の長さを推定
      var h=this.hist, n=h.length; if(n<150){ this.conf=0; return; }
      var m=0,i; for(i=0;i<n;i++) m+=h[i]; m/=n;
      var v=0; for(i=0;i<n;i++) v+=(h[i]-m)*(h[i]-m); if(v<1e-6){ this.conf=0; return; }
      var best=0,r=[];
      for(var lag=20;lag<=125;lag++){ var c=0; for(i=lag;i<n;i++) c+=(h[i]-m)*(h[i-lag]-m); c/=(v*(n-lag)/n); r[lag]=c; if(lag<=120&&c>best) best=c; }
      // いちばん短い「はっきりした山」を選ぶ(2回分・3回分の長さを1回と取り違えないため)
      var pick=0;
      for(var L=25;L<=120;L++){ if(r[L]>=r[L-1]&&r[L]>=r[L+1]&&r[L]>=0.85*best){ pick=L; break; } }
      if(!pick){ this.conf=0; return; }
      this.conf=r[pick]; this.period=pick/10;
    },
    update:function(dt){ if(this.on) this.feed(this.rms(),dt); }
  };

  // ===== 見本の呼吸:寄り添ってから、少しずつ導く =====
  var IN=0.4;                                  // 吸う4割・吐く6割
  var Pacer = {
    t:0, phase:0, period:60/11, mode:"guide", micUsed:false, user:0,
    begin:function(mic){ this.micUsed=mic; this.mode = mic ? "follow" : "guide"; this.period = mic ? 60/12 : 60/11; },
    step:function(dt, uPeriod, uConf){
      this.t+=dt;
      var sure = this.micUsed && uConf>0.35 && uPeriod>0;
      if(this.mode==="follow"){
        if(sure){ var tgt=Math.max(3.5,Math.min(10,uPeriod)); this.period += (tgt-this.period)*Math.min(1,dt/4); }
        if(this.t>75) this.mode="guide";
      } else {
        // 見本はあなたより最大1.5回/分だけ先を行く。ついて来ていれば、さらにゆっくりへ。来ていなければ待つ
        var bpm=60/this.period, ub = sure ? 60/uPeriod : bpm;
        if(!sure || ub - bpm < 1.5){ bpm = Math.max(6, bpm - 0.6/60*dt); }
        else if(ub - bpm > 2.5){ bpm += Math.min(0.5/60*dt, ub - bpm - 2.5); }  // 離れすぎたら少し戻って迎えに行く
        this.period=60/bpm;
      }
      this.phase += dt/this.period;
    },
    value:function(){ var f=this.phase%1; if(f<IN){ var a=f/IN; return 0.5-0.5*Math.cos(Math.PI*a);} var b=(f-IN)/(1-IN); return 0.5+0.5*Math.cos(Math.PI*b); }
  };

  function dimValue(t){ var hold=180; if(t<=hold) return 1; var x=Math.min(1,(t-hold)/(SESSION-hold)); return Math.pow(1-x,1.6); }
  function calmValue(t){ return Math.min(1, t/420); }

  var canvas=document.getElementById("c");
  var gl=canvas.getContext("webgl",{antialias:false,alpha:false,preserveDrawingBuffer:CAPTURE,powerPreference:"low-power"});
  if(!gl) return;
  var VS="attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";
  var FS = [
  "precision highp float;",
  "uniform vec2 uRes; uniform float uTime, uBreath, uDim, uCalm, uTouch, uUser;",
  "uniform float uTex, uStar, uCloud, uMist, uSpark, uPop, uDetail, uGustAmp;",
  "uniform float uG0,uG1,uG2,uG3,uG4,uG5;",
  "const mat2 R0=mat2(.8,-.6,.6,.8);",
  "float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}",
  "vec2 hash2(vec2 p){return vec2(hash(p),hash(p+17.17));}",
  "float noise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);",
  " return mix(mix(hash(i),hash(i+vec2(1,0)),u.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x),u.y);}",
  "float fbm(vec2 p){float v=0.,a=.5;mat2 r=mat2(.8,-.6,.6,.8);for(int i=0;i<5;i++){v+=a*noise(p);p=r*p*2.03;a*=.5;}return v;}",
  "float fbm7(vec2 p,float det){float v=0.,a=.5;mat2 r=mat2(.8,-.6,.6,.8);for(int i=0;i<7;i++){float w=i>=4?det:1.0;v+=a*w*(noise(p)-0.5);p=r*p*2.07;a*=.52;}return v+0.5;}",
  // 水面の高さ:奥から寄せる大きなうねり+大小のさざ波(遠くで見分けられない細かさは消す)
  "float waveH(vec2 W,float t,float fx,float fz,float calm,float g){",
  " float h=0.06*mix(1.0,0.7,calm)*sin(W.y*3.0+t*0.50+1.6*noise(W*vec2(0.5,0.8)));",
  " float a=0.20,f=7.0; mat2 R=mat2(.8,-.6,.6,.8); vec2 p=W*vec2(0.65,1.0);",
  " for(int i=0;i<6;i++){",
  "  float fi=float(i);",
  "  float fade=smoothstep(0.9,0.25,f*max(fx,fz*0.12));",
  "  float lv=i>=3?uDetail:1.0;",
  "  h+=a*fade*lv*(noise(p*f+vec2(t*0.22*(1.0+fi*0.35),-t*0.30*(1.0+fi*0.2)))*2.0-1.0);",
  "  p=R*p; f*=1.95; a*=0.55;",
  " }",
  // 息の風:手前から奥へ吹き抜ける細かいさざ波(風の当たる所はまだらになる)
  " if(g>0.001){",
  "  float patch=smoothstep(0.25,0.75,noise(W*vec2(1.6,0.9)+vec2(0.0,-t*0.35)));",
  "  float nr=clamp((0.16/max(W.y,0.17)-0.01)/0.56,0.,1.);",
  "  float gf=11.0*(1.0+2.5*nr); float ga=0.30*g*(0.25+0.75*patch)/(1.0+1.5*nr);",
  "  float fd=smoothstep(0.9,0.25,gf*max(fx,fz*0.12)); float fd2=smoothstep(0.9,0.25,gf*1.9*max(fx,fz*0.12));",
  "  h+=ga*fd*(noise(W*vec2(gf*0.8,gf)+vec2(0.0,-t*2.2))*2.0-1.0);",
  "  h+=ga*0.6*fd2*(noise(R0*W*gf*1.9+vec2(0.0,-t*3.0))*2.0-1.0);",
  " }",
  " return h;",
  "}",
  "float gustAt(float near){",   // 画面の手前(near=1)ほど早く、奥ほど遅れて風が届く
  " float d=(1.0-near)*5.0;",
  " float i0=floor(d); float f=d-i0;",
  " float a= i0<0.5?uG0: i0<1.5?uG1: i0<2.5?uG2: i0<3.5?uG3: i0<4.5?uG4:uG5;",
  " float b= i0<0.5?uG1: i0<1.5?uG2: i0<2.5?uG3: i0<3.5?uG4:uG5;",
  " return mix(a,b,f)*uGustAmp;",
  "}",
  "float slopeN(float fx,float fz){float s=0.06*3.0,a=0.20,f=7.0;for(int i=0;i<6;i++){float lv=i>=3?uDetail:1.0;s+=a*f*lv*smoothstep(0.9,0.25,f*max(fx,fz*0.12));f*=1.95;a*=0.55;}return s;}",
  "void main(){",
  " vec2 frag=gl_FragCoord.xy; vec2 uv=frag/uRes; float asp=uRes.x/uRes.y;",
  " float t=uTime; float hz=0.56;",
  " vec2 moonPos=vec2(0.5,0.80);",
  " vec2 q=vec2((uv.x-moonPos.x)*asp,uv.y-moonPos.y);",
  " float br=uBreath; float tc=uTouch;",
  " vec3 moonCol=vec3(1.0,0.64,0.32);",
  " vec3 col;",
  " if(uv.y>hz){",
  "  float h=(uv.y-hz)/(1.-hz);",
  "  col=mix(vec3(0.0060,0.0034,0.0030),vec3(0.0009,0.0008,0.0013),pow(h,0.6));",
  "  float d=length(q);",
  "  vec2 sp=vec2(uv.x*asp,uv.y)*uRes.y/7.0; vec2 si=floor(sp); vec2 sf=fract(sp)-0.5;",
  "  vec2 so=(hash2(si)-0.5)*0.6; float sh=hash(si+3.1);",
  "  float on=step(1.0-0.10*uStar,sh);",
  "  float tw=0.6+0.4*sin(t*(0.3+hash(si+9.)*0.5)+sh*40.);",
  "  float star=on*exp(-dot(sf-so,sf-so)*22.0)*tw*(0.25+0.75*hash(si+5.));",
  "  star*=smoothstep(0.05,0.35,h)*smoothstep(0.10,0.30,d);",
  "  col+=vec3(1.0,0.86,0.72)*star*0.16;",
  "  float r=0.036;",
  "  float disc=smoothstep(r,r-0.003,d);",
  "  float maria=fbm(q*38.0+3.0); float tex=0.70+0.30*smoothstep(0.62,0.38,maria);",
  "  float limb=0.82+0.18*sqrt(max(0.,1.-d*d/(r*r)));",
  "  float glow=exp(-d*mix(14.0,9.0,br)*(1.0-0.12*tc))*(0.6+0.4*br+0.15*tc);",
  "  float halo=exp(-d*3.2)*0.009;",
  "  vec3 sky=col+moonCol*(glow*0.040+halo);",
  "  vec3 moon=moonCol*disc*0.26*tex*limb;",
  // 雲:大小の形が重なった縁。1〜2分で月の前を横切り、形もゆっくり変わる
  "  vec2 cp=vec2(uv.x*asp*1.2+t*0.0075, uv.y*5.0);",
  "  vec2 warp=vec2(fbm(cp*0.8+vec2(t*0.003,0.)),fbm(cp*0.8+vec2(5.2,1.3)-vec2(0.,t*0.002)));",
  "  float cl=fbm7(cp+warp*1.1,uDetail);",
  "  float cov=0.47;",
  "  float edge=mix(0.16,0.07,uDetail);",
  "  float cA=smoothstep(cov,cov+edge,cl)*0.92*smoothstep(0.0,0.20,h);",
  "  float thin=smoothstep(cov+edge*2.5,cov,cl);",
  "  float lit=exp(-d*3.0);",
  "  vec3 cloudCol=vec3(0.0060,0.0040,0.0034)*(0.7+0.6*fbm(cp*3.0))+moonCol*(lit*0.035+exp(-d*11.0)*0.07)*(0.35+0.65*thin);",
  "  col=sky+moon*(1.0-cA*0.75);",
  "  col=mix(col,cloudCol+moon*0.25*(1.0-cA),cA);",
  "  float mist=exp(-h*9.0)*(0.6+0.4*fbm(vec2(uv.x*asp*2.0-t*0.008,h*6.0)));",
  "  col+=vec3(0.010,0.0062,0.0042)*mist*(0.6+0.4*exp(-abs(q.x)*3.0));",
  " } else {",
  "  float dz=hz-uv.y;",
  "  float z=0.16/(dz+0.010);",
  "  float xw=(uv.x-0.5)*asp*z;",
  "  float near=clamp(dz/hz,0.,1.);",
  "  float px=(uv.x-moonPos.x)*asp;",
  "  float fx=asp*z/uRes.x*1.5; float fz=0.16/((dz+0.01)*(dz+0.01))/uRes.y*1.5;",
  "  vec2 W=vec2(xw,z);",
  "  float ex=max(fx,0.003), ez=max(fz,0.003);",
  "  float g=gustAt(near);",
  "  float hC=waveH(W,t,fx,fz,uCalm,g);",
  "  float sz=(waveH(W+vec2(0.,ez),t,fx,fz,uCalm,g)-waveH(W-vec2(0.,ez),t,fx,fz,uCalm,g))/(2.0*ez);",
  "  float sx=(waveH(W+vec2(ex,0.),t,fx,fz,uCalm,g)-waveH(W-vec2(ex,0.),t,fx,fz,uCalm,g))/(2.0*ex);",
  "  vec3 sea=mix(vec3(0.0025,0.0017,0.0016),vec3(0.0007,0.0006,0.0009),near)*(0.85+0.5*clamp(hC,-0.5,0.5));",
  "  float width=mix(0.022,0.12,pow(near,0.8))*(1.0+0.40*br+0.20*tc);",
  "  float lat=px/width;",
  "  float path=exp(-lat*lat*1.1);",
  // 月の方へ傾いた面だけが光る(傾きが合う所が群れになって砕ける)
  "  float S=max(slopeN(fx,fz),0.15);",
  "  float tilt=(sz - 0.5*sx*sign(px)*clamp(abs(lat),0.,1.))/S;",
  "  float S2=S+0.3*g*11.0*0.30*smoothstep(0.9,0.25,11.0*max(fx,fz*0.12));",
  "  float th=(mix(0.42,0.16,path)+0.14*near-0.03*br)*S2/S;",
  "  float glint=smoothstep(th,th+0.14,tilt);",
  "  float hzFade=smoothstep(0.0,0.03,dz);",
  "  float k=mix(0.32,0.10,pow(near,0.6));",
  "  col=sea+moonCol*k*hzFade*(path*0.10 + exp(-lat*lat*0.5)*glint);",
  "  col+=moonCol*0.020*exp(-dz*120.0)*exp(-px*px*18.0);",
  "  col+=vec3(0.010,0.0062,0.0042)*exp(-dz*30.0)*0.5;",
  " }",
  " float vig=smoothstep(1.3,0.3,length((uv-vec2(0.5,0.6))*vec2(asp,1.0)));",
  " col*=mix(0.6,1.0,vig);",
  " col*=uDim;",
  " col=pow(max(col,0.0),vec3(0.4545));",
  " float n=hash(frag+fract(t*0.731))+hash(frag*1.37-fract(t*0.517))-1.0;",
  " col+=n/255.0;",
  " gl_FragColor=vec4(col,1.0);",
  "}"].join("\n");
  function sh(type,src){ var s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
  var pr=gl.createProgram(); gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS)); gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));
  gl.linkProgram(pr); gl.useProgram(pr);
  var buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  var loc=gl.getAttribLocation(pr,"p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  var U={}; ["uRes","uTime","uBreath","uDim","uCalm","uTouch","uUser","uTex","uStar","uCloud","uMist","uSpark","uPop","uDetail","uGustAmp","uG0","uG1","uG2","uG3","uG4","uG5"].forEach(function(n){U[n]=gl.getUniformLocation(pr,n);});
  var scale=Math.min(window.devicePixelRatio||1,2);
  function resize(){ var w=Math.round(canvas.clientWidth*scale),h=Math.round(canvas.clientHeight*scale); if(!w||!h) return; if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h);} }
  addEventListener("resize",resize); if(window.visualViewport) visualViewport.addEventListener("resize",resize); resize();

  var LEVELS={1:[1,0,0,0.5,0.6,0],2:[1,0.6,0.6,0.8,0.85,0],3:[1,1,1,1,1,0],4:[1,1,1,1,1,1]};   // 月の模様,星,雲,霧,光の粒
  var LV=LEVELS[3]; var DET=parseFloat(P.get("detail")||"0.5"); var GUST=parseFloat(P.get("gust")||"1");
  var gustHist=[]; function gustPush(v){ gustHist.push(v); if(gustHist.length>40) gustHist.shift(); }
  function gustDelay(sec){ var k=gustHist.length-1-Math.round(sec*10); return k>=0?gustHist[k]:0; }
  function draw(t,guide,user,dim,touch){
    gl.uniform1f(U.uTex,LV[0]); gl.uniform1f(U.uStar,LV[1]); gl.uniform1f(U.uCloud,LV[2]); gl.uniform1f(U.uMist,LV[3]); gl.uniform1f(U.uSpark,LV[4]); gl.uniform1f(U.uPop,LV[5]); gl.uniform1f(U.uDetail,DET); gl.uniform1f(U.uGustAmp,GUST); for(var gi=0;gi<6;gi++) gl.uniform1f(U["uG"+gi],gustDelay(gi*0.5));
    gl.uniform2f(U.uRes,canvas.width,canvas.height); gl.uniform1f(U.uTime,t); gl.uniform1f(U.uBreath,guide);
    gl.uniform1f(U.uDim,dim); gl.uniform1f(U.uCalm,calmValue(t)); gl.uniform1f(U.uTouch,touch); gl.uniform1f(U.uUser,user);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }

  // 画面に出す「あなたの息」:拾った音にゆっくり寄り添う(パッと反応させない)
  var userShown=0, userWeight=0, gustAcc=0;
  function followUser(env,dt){
    var w = (Sensor.on && (Sensor.conf>0.35 || Sensor.snr>2.5)) ? 1 : 0;   // 息の音がはっきり聞こえている時だけ
    userWeight += (w-userWeight)*Math.min(1,dt/(w>userWeight?1.5:6));      // 出る時は1.5秒、消える時は6秒かけて
    userShown += (env-userShown)*Math.min(1,dt/0.6);
    gustAcc+=dt; while(gustAcc>=0.1){ gustAcc-=0.1; gustPush(userShown*userWeight); }   // 0.1秒ごとに「風」の強さを記録
    return userShown*userWeight + 0.35*(1-userWeight);
  }

  window.NEMU={Sensor:Sensor,Pacer:Pacer};

  if(CAPTURE){
    // 確認用:疑似の人の息で、時刻を少しずつ進めながら描く
    var simT=0, simPhase=0, simPeriod=60/14;
    window.capStep=function(dt){
      simT+=dt;
      // 疑似の人:見本より少し遅れて、見本の速さに近づいていく
      if(simT>60) simPeriod += (Pacer.period - simPeriod)*Math.min(1,dt/25);
      simPhase+=dt/simPeriod; var f=simPhase%1;
      var amp = f<IN ? 0.35*Math.sin(Math.PI*f/IN) : 1.0*Math.sin(Math.PI*(f-IN)/(1-IN));   // 吸う音は小さく、吐く音は大きく
      var r = 0.002 + 0.02*Math.max(0,amp) + 0.0008*Math.random();
      Sensor.feed(r,dt);
      Pacer.step(dt, Sensor.period, Sensor.conf);
      return {t:simT, guidePeriod:Pacer.period, userPeriod:Sensor.period, conf:Sensor.conf, mode:Pacer.mode, env:Sensor.env};
    };
    window.capDraw=function(){ resize(); draw(simT, Pacer.value(), userShown*userWeight+0.35*(1-userWeight), dimValue(simT), 0); return true; };
    window.capFollow=function(dt){ return followUser(Sensor.env,dt); };
    Pacer.begin(true); Sensor.on=true;   // 確認用:疑似の息をマイクの代わりに使う
    window.setGust=function(a){ gustHist=a.slice(); };
    window.renderAt=function(t,user){ resize(); draw(t, 0.6, user==null?0.6:user, 1, 0); return true; };
    window.nemuReady=true;
    return;
  }

  var startEl=document.getElementById("start");
  var DEBUG=P.get("debug")==="1", dbgEl=document.getElementById("dbg");
  var started=false, t0=null, last=null, touch=0, touchTarget=0, wake=null;
  function begin(){
    if(started) return; started=true;
    startEl.style.opacity="0";
    if(navigator.wakeLock&&navigator.wakeLock.request){ navigator.wakeLock.request("screen").then(function(w){wake=w;}).catch(function(){}); }
    Sensor.start().then(function(ok){ Pacer.begin(ok); });
    Pacer.begin(false);
  }
  canvas.addEventListener("pointerdown",function(e){ e.preventDefault(); touchTarget=1; begin(); });
  addEventListener("pointerup",function(){touchTarget=0;}); addEventListener("pointercancel",function(){touchTarget=0;});
  if(TEST) begin();

  function frame(now){
    if(last===null) last=now;
    var dt=Math.min(0.05,(now-last)/1000); last=now;
    touch += (touchTarget-touch)*Math.min(1,dt*2.5);
    if(!started){ draw(now/1000*0.2, 0.15, 0, 0.55, touch); requestAnimationFrame(frame); return; } // 始める前:静かに薄く
    if(t0===null) t0=now;
    resize();
    var t=(now-t0)/1000;
    Sensor.update(dt);
    Pacer.step(dt, Sensor.period, Sensor.conf);
    var user = followUser(Sensor.env,dt);
    var dim = Math.min(1, t/4) * 0.45 + 0.55; dim = Math.min(dim, 1) * dimValue(t);   // 始めた直後はなめらかに明るく
    draw(t, Pacer.value(), user, dim, touch);
    if(DEBUG){ dbgEl.textContent="マイク: "+Sensor.status+(Sensor.ctx?" / 音の処理: "+Sensor.ctx.state:"")+"\n音の強さ: "+(Sensor.level*1000).toFixed(2)+"  静けさ: "+(Sensor.floor*1000).toFixed(2)+"  倍率: "+Sensor.snr.toFixed(1)+"\n息の反応: "+userWeight.toFixed(2)+"  拾った速さ: "+(Sensor.period?(60/Sensor.period).toFixed(1):"-")+"回/分 ("+Sensor.conf.toFixed(2)+")\n見本: "+(60/Pacer.period).toFixed(1)+"回/分 "+Pacer.mode+"\n画面: "+canvas.width+"x"+canvas.height; }
    if(TEST && Math.floor(t)%5===0 && Math.floor(t)!==window._lastLog){ window._lastLog=Math.floor(t);
      console.log("LOG t="+t.toFixed(0)+" mode="+Pacer.mode+" guide/min="+(60/Pacer.period).toFixed(1)+" user/min="+(Sensor.period?(60/Sensor.period).toFixed(1):"-")+" conf="+Sensor.conf.toFixed(2)); }
    if(t>=SESSION){ gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT); if(wake) wake.release(); return; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
