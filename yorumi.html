<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0E0C0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>夜見</title>
<style>
:root{
  --bg:#0E0C0A; --surf:#1A1714; --tx:#DCD2C3; --tx2:#A3988A; --tx3:#8A7F71; --line:#2B2620; --amber:#CFA066; --amber-d:#8F6D43; --dim:#4A4238;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP",sans-serif;
  --serif:"Hiragino Mincho ProN","Noto Serif CJK JP",serif;
  --num:-apple-system,"Hiragino Sans","Noto Sans CJK JP",sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --side:24px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none}
body{font:400 17px/1.6 var(--sans);letter-spacing:.03em;color:var(--tx);-webkit-text-size-adjust:100%;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:background-color .35s}
body.black{background:#000}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit;-webkit-user-select:none;user-select:none;transition:opacity .15s}
button:active{opacity:.55}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.02em}

/* 景色 */
#backdrop{position:fixed;inset:0;background:var(--bg) center/cover no-repeat}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;transition:opacity .35s,transform .35s ease}
/* 景色を選ぶ・紹介・マイクの間だけ、景色を上へずらして下の文字に隠れないようにする(眺める画面では全画面) */
body.lift #scene{transform:translateY(var(--lift,-18%))}
body.black #scene{opacity:0}

/* 画面 */
.screen{position:fixed;inset:0;opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .35s ease,visibility 0s linear .35s;touch-action:none}
.screen.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .35s ease,visibility 0s}
.pad{position:absolute;left:0;right:0;padding:0 var(--side)}
.top{top:calc(var(--st) + 8px)}
.bottom{bottom:0;padding-bottom:calc(max(var(--sb),8px) + 16px)}
.fadebg{z-index:0}
.fadebg::before{content:"";position:absolute;z-index:-1;left:0;right:0;bottom:0;top:-96px;pointer-events:none;
  background:linear-gradient(to bottom,rgba(14,12,10,0) 0,rgba(14,12,10,.92) 96px,#0E0C0A 100%)}

.btn{display:flex;align-items:center;justify-content:center;width:100%;height:56px;padding:0 24px;border-radius:8px;
  border:1px solid rgba(220,210,195,.20);background:rgba(14,12,10,.38);color:var(--tx);font-weight:400;letter-spacing:.04em}
.btn[disabled]{color:var(--tx3);border-color:var(--line);opacity:1}
.tbtn{display:inline-flex;align-items:center;min-height:44px;color:var(--tx2);font-size:15px}
.bar{display:flex;justify-content:space-between;align-items:center;min-height:48px}
.bar .tbtn:last-child{margin-right:-16px;padding:0 16px}

/* 紹介 */
#s-intro .vtitle{position:absolute;writing-mode:vertical-rl;font:400 40px/1 var(--serif);letter-spacing:.04em;color:var(--tx);
  right:calc(50% + 48px);top:calc(20% - 8px)}
#s-intro .line{color:var(--tx2);font-size:17px}
#s-intro .btn{margin-top:40px}

/* マイク */
#s-mic{background:rgba(14,12,10,.45)}
#s-mic h2{font-size:22px;font-weight:400;line-height:1.5;letter-spacing:.04em}
#s-mic .lead{margin-top:16px;color:var(--tx2)}
#s-mic .facts{margin-top:24px;border-top:1px solid var(--line)}
#s-mic .facts p{padding:16px 0;border-bottom:1px solid var(--line);color:var(--tx2);font-size:15px}
#s-mic .btn{margin-top:40px}

/* 景色を選ぶ */
.dots{display:flex;flex-wrap:wrap;align-items:center;column-gap:16px;min-height:24px}
#h-dots{display:flex;gap:6px;flex:none}
#h-dots i{display:block;width:16px;height:1px;background:var(--dim)}
#h-dots i.cur{background:var(--tx)}
#h-dots i.paid{background:repeating-linear-gradient(to right,var(--dim) 0 4px,transparent 4px 6px)}
#h-dots i.paid.cur{background:repeating-linear-gradient(to right,var(--tx) 0 4px,transparent 4px 6px)}
#h-swipe{font-style:normal;font-size:13px;line-height:24px;color:var(--tx3);white-space:nowrap;transition:opacity .35s}
#h-swipe.gone{opacity:0}
#s-home .name{margin-top:8px;display:flex;align-items:baseline;gap:8px;min-width:0}
#s-home .name b{font:400 26px/1.4 var(--serif);letter-spacing:.02em;color:var(--tx);overflow-wrap:anywhere;min-width:0}
#s-home .name i{font-style:normal;font-size:13px;color:var(--tx2);flex:none;white-space:nowrap}
#s-home .sub{margin-top:8px;font-size:15px;color:var(--tx2);overflow-wrap:anywhere}
.thead{margin-top:16px;height:24px;display:flex;justify-content:flex-end;align-items:center;font-size:13px;color:var(--tx3)}
.thead.hide span{visibility:hidden}
.twrap{border-top:1px solid var(--line)}
.times{display:flex;justify-content:space-between}
.times button{min-width:64px;height:48px;display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.times .t{position:relative;line-height:24px;font-size:17px;white-space:nowrap}
.times .t small{font-size:13px;margin-left:2px}
.times button.lock{color:var(--tx3)}
.times button.sel{color:var(--amber)}
.times button.sel .t::after{content:"";position:absolute;left:0;right:0;top:-13px;height:1px;background:var(--amber)}
#s-home .btn{margin-top:16px}
#s-home .btn .lr{display:flex;width:100%;justify-content:space-between;align-items:baseline}
#b-go-r{color:var(--tx2)}

/* 広告(仮) */
#s-ad{background:var(--bg)}
#s-ad .adtag{font-size:13px;color:var(--tx2);border:1px solid var(--line);border-radius:4px;padding:0 8px;letter-spacing:.04em}
#s-ad .count{font-size:15px;color:var(--tx3);min-height:44px;display:inline-flex;align-items:center}
#s-ad .frame{position:absolute;left:var(--side);right:var(--side);top:calc(var(--st) + 72px);bottom:calc(max(var(--sb),8px) + 72px);
  background:var(--surf);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--tx3);font-size:13px}
#s-ad .note{font-size:13px;color:var(--tx3)}

/* 眺める */
#s-view .ctrl{opacity:0;transition:opacity 1s ease;pointer-events:none}
#s-view .ctrl.on{opacity:.82;transition:opacity .35s ease;pointer-events:auto}
#s-view .ctrl .row{display:flex;justify-content:space-between;align-items:flex-end}
#s-view .ctrl .rest small{display:block;font-size:13px;color:var(--tx3)}
#s-view .ctrl .rest .num{font-size:28px;line-height:1.3;color:var(--tx2);font-weight:400}
#s-view .ctrl .end{height:48px;padding:0 24px;border:1px solid rgba(163,152,138,.32);border-radius:8px;color:var(--tx2);font-size:15px}
#s-view .hint{font-size:13px;color:var(--tx3);opacity:0;transition:opacity 1.5s ease;pointer-events:none}
#s-view .hint.on{opacity:.75}

/* 真っ黒 */
#s-end{background:#000}

/* 設定・有料の案内 */
.sheet{background:var(--bg);display:flex;flex-direction:column}
.sheet header{flex:none;padding:calc(var(--st) + 8px) var(--side) 0;display:flex;justify-content:space-between;align-items:center;min-height:56px}
.sheet header h1{font-size:17px;font-weight:600;letter-spacing:.04em}
.sheet header .tbtn{margin-right:-16px;padding:0 16px;font-size:17px}
.sheet .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:0 var(--side) calc(max(var(--sb),8px) + 24px)}
#s-settings{z-index:20}
#s-paywall{z-index:30}

.group{margin-top:24px}
.group h3{font-size:13px;font-weight:400;color:var(--tx3);letter-spacing:.04em;padding-bottom:8px;border-bottom:1px solid var(--line)}
.rowb{display:flex;width:100%;justify-content:space-between;align-items:center;gap:16px;min-height:56px;padding:8px 0;border-bottom:1px solid var(--line);text-align:left;font-size:17px;color:var(--tx)}
.rowb .v{font-size:15px;color:var(--tx2);flex:none;display:flex;align-items:center;gap:8px}
.rowb small{display:block;font-size:13px;color:var(--tx3);margin-top:0}
.rowb.static:active,.rowb.toggle:active{opacity:1}
.chev{width:7px;height:7px;border-top:1px solid var(--tx3);border-right:1px solid var(--tx3);transform:rotate(45deg);margin-right:3px}
.sw{position:relative;display:block;width:51px;height:31px;border-radius:16px;background:var(--line);flex:none;transition:background-color .15s}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:var(--tx3);transition:transform .15s,background-color .15s}
.sw.on{background:var(--amber-d)}
.sw.on::after{transform:translateX(20px);background:var(--tx)}

.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 8px;margin-top:8px}
.thumbs figure{min-width:0}
.thumbs .ph{aspect-ratio:3/2;border-radius:2px;background:var(--surf) center/cover no-repeat}
.thumbs figcaption{margin-top:8px;font-size:13px;line-height:1.5;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.perks{margin-top:24px;border-top:1px solid var(--line)}
.perks p{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);font-size:17px;line-height:1.4}
.perks p span{font-size:15px;color:var(--tx2)}
.plans{margin-top:24px;display:flex;flex-direction:column;gap:8px}
.plan{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:64px;padding:8px 16px;border:1px solid var(--line);border-radius:8px;text-align:left}
.plan.sel{border-color:var(--amber)}
.plan small{display:block;font-size:13px;color:var(--tx3)}
.plan .p{font-size:17px}
#s-paywall .btn{margin-top:16px}
.fine{margin-top:8px;display:flex;flex-wrap:wrap;column-gap:24px}
.fine .tbtn{font-size:13px;color:var(--tx2)}
.legal{margin-top:16px;font-size:13px;line-height:1.7;color:var(--tx3);word-break:keep-all;overflow-wrap:anywhere}
@media (max-height:700px){
  .thumbs{gap:8px}
  .thumbs figcaption{margin-top:0}
  .perks,.plans{margin-top:16px}
  .perks p{padding:8px 0}
  .plan{min-height:56px}
  .legal{margin-top:8px}
}
</style>
</head>
<body>
<div id="backdrop"></div>
<canvas id="scene"></canvas>

<section class="screen" id="s-intro">
  <div class="vtitle" id="i-vtitle">夜見</div>
  <div class="pad bottom fadebg">
    <p class="line">眺めて眠る</p>
    <button class="btn" id="b-start">はじめる</button>
  </div>
</section>

<section class="screen" id="s-mic">
  <div class="pad bottom fadebg">
    <h2>息で景色が変わります</h2>
    <p class="lead">ゆっくり吐くと光がふえたり<br>窓がくもったりします</p>
    <div class="facts">
      <p>マイクで見るのは息の強さだけです</p>
      <p>録音も送信もしません</p>
    </div>
    <button class="btn" id="b-mic">続ける</button>
  </div>
</section>

<section class="screen" id="s-home">
  <div class="pad top"><div class="bar"><span></span><button class="tbtn" id="b-settings">設定</button></div></div>
  <div class="pad bottom fadebg">
    <div class="dots"><span id="h-dots"></span><em id="h-swipe" hidden>左右になぞると景色が変わります</em></div>
    <div id="h-info">
      <div class="name"><b id="h-name"></b><i id="h-lock" hidden>有料</i></div>
      <p class="sub" id="h-sub"></p>
    </div>
    <div class="thead" id="h-thead"><span>30分から有料</span></div>
    <div class="twrap"><div class="times" id="h-times"></div></div>
    <button class="btn" id="b-go"><span class="lr"><span id="b-go-l">眺める</span><span class="num" id="b-go-r"></span></span></button>
  </div>
</section>

<section class="screen" id="s-ad">
  <div class="pad top"><div class="bar"><span class="adtag">広告</span><span id="ad-close-slot"><span class="count num" id="ad-count"></span></span></div></div>
  <div class="frame">ここに広告が入ります</div>
  <div class="pad bottom"><p class="note">閉じると眺め始めます</p></div>
</section>

<section class="screen" id="s-view">
  <div class="pad bottom">
    <p class="hint" id="v-hint">触れると波紋 長押しで残り時間</p>
    <div class="ctrl" id="v-ctrl">
      <div class="row">
        <div class="rest"><small>残り</small><span class="num" id="v-rest">0:00</span></div>
        <button class="end" id="b-end">終える</button>
      </div>
    </div>
  </div>
</section>

<section class="screen" id="s-end"></section>

<section class="screen sheet" id="s-settings">
  <header><h1>設定</h1><button class="tbtn" id="b-set-close">閉じる</button></header>
  <div class="scroll">
    <div class="group">
      <button class="rowb" id="r-plan">有料プラン<span class="v"><span id="r-plan-v"></span><i class="chev"></i></span></button>
    </div>
    <div class="group">
      <button class="rowb toggle" id="r-mic" role="switch"><span>息で景色が変わる<small>マイクを使います</small></span><i class="sw" id="r-mic-v"></i></button>
    </div>
    <div class="group">
      <button class="rowb" id="r-restore">購入を復元</button>
      <button class="rowb">利用規約<span class="v"><i class="chev"></i></span></button>
      <button class="rowb">プライバシーポリシー<span class="v"><i class="chev"></i></span></button>
      <button class="rowb">お問い合わせ<span class="v"><i class="chev"></i></span></button>
      <div class="rowb static">バージョン<span class="v">試作</span></div>
    </div>
    <div class="group">
      <h3>確かめ用</h3>
      <button class="rowb toggle" id="r-paid" role="switch">有料にする<i class="sw" id="r-paid-v"></i></button>
      <button class="rowb toggle" id="r-fast" role="switch"><span>時間を縮める<small>15分を1分に</small></span><i class="sw" id="r-fast-v"></i></button>
      <button class="rowb" id="r-again">最初の案内をもう一度</button>
    </div>
  </div>
</section>

<section class="screen sheet" id="s-paywall">
  <header><h1>有料プラン</h1><button class="tbtn" id="b-pw-close">閉じる</button></header>
  <div class="scroll">
    <div class="thumbs" id="pw-thumbs"></div>
    <div class="perks">
      <p>広告<span>なし</span></p>
      <p>景色<span id="pw-count"></span></p>
      <p>時間<span>15・30・45・60分</span></p>
    </div>
    <div class="plans">
      <button class="plan sel" data-plan="year"><span>年額<small>月あたり約242円</small></span><span class="p">2,900円</span></button>
      <button class="plan" data-plan="month"><span>月額</span><span class="p">480円</span></button>
    </div>
    <button class="btn" id="b-buy">登録する</button>
    <p class="legal">期間が終わる24時間前までに解約しない限り<wbr>自動で更新されます<br>解約はiPhoneの設定から行えます</p>
    <div class="fine">
      <button class="tbtn" id="b-pw-restore">購入を復元</button>
      <button class="tbtn">利用規約</button>
      <button class="tbtn">プライバシーポリシー</button>
    </div>
  </div>
</section>

<script>
/* Yorumi 景色の共通部品
   - 景色(scene)は「vec3 sceneColor(vec2 frag)」だけを書く。暗くする・光の量・ガンマ・ざらつき止めはここで共通に掛ける
   - 共通で使える値: uRes(画面の画素数) uTime(秒) uBrE(息 0〜1。吐くと上がり、吐き終わってゆっくり下がる)
                     uTouch(触れている間 1 に近づく) uRip[32](波紋: x,y=画面の位置 左下0〜1, z=始まった時刻。未使用は z<0)
   - 共通の関数: hash hash2 noise fbm
*/
(function(){
"use strict";
var Y = window.Yorumi = window.Yorumi || {};
Y.scenes = Y.scenes || [];
Y.registerScene = function(s){ Y.scenes.push(s); };

var HEADER = [
"precision highp float;",
"uniform vec2 uRes; uniform float uTime,uDim,uGain,uBrE,uTouch; uniform vec3 uRip[32];",
"float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}",
"vec2 hash2(vec2 p){return vec2(hash(p),hash(p+17.17));}",
"float noise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);",
" return mix(mix(hash(i),hash(i+vec2(1,0)),u.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x),u.y);}",
"float fbm(vec2 p){float v=0.,a=.5;mat2 r=mat2(.8,-.6,.6,.8);for(int i=0;i<5;i++){v+=a*noise(p);p=r*p*2.03;a*=.5;}return v;}",
""].join("\n");
var FOOTER = [
"void main(){",
" vec2 frag=gl_FragCoord.xy; vec3 col=sceneColor(frag);",
" col*=uDim; col*=uGain;",
" col=pow(max(col,0.0),vec3(0.4545));",
" float n=hash(frag+fract(uTime*0.731))+hash(frag*1.37-fract(uTime*0.517))-1.0;",
" col+=n/255.0;",
" gl_FragColor=vec4(col,1.0);",
"}"].join("\n");
Y.GAIN = 0.55;   // 景色全体の光の量(本人決定 2026-11-16)

/* ===== 息を拾う(マイク) ===== */
var Breath = Y.Breath = {
  on:false, level:0, floor:0, peak:0, env:0, shown:0, out:0, status:"未開始",
  start:function(){
    var self=this;
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ self.status="非対応"; return Promise.resolve(false); }
    var ctx=self.ctx||new AC(); self.ctx=ctx; if(ctx.resume) ctx.resume();
    self.status="許可待ち";
    return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(function(stream){
      self.stream=stream;
      var src=ctx.createMediaStreamSource(stream);
      var hp=ctx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=150;
      var lp=ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=3000;
      var an=ctx.createAnalyser(); an.fftSize=1024;
      src.connect(hp); hp.connect(lp); lp.connect(an);
      self.an=an; self.buf=new Float32Array(an.fftSize); self.on=true; self.status="使用中";
      if(ctx.state!=="running") ctx.resume();
      return true;
    }).catch(function(err){ self.status="使えない"; return false; });
  },
  stop:function(){ if(this.stream){ this.stream.getTracks().forEach(function(t){t.stop();}); } this.stream=null; this.on=false; this.status="止めた"; },
  rms:function(){ this.an.getFloatTimeDomainData(this.buf); var s=0,b=this.buf; for(var i=0;i<b.length;i++) s+=b[i]*b[i]; return Math.sqrt(s/b.length); },
  feed:function(r,dt){
    if(this.floor===0){ this.floor=r; this.peak=r*2+1e-6; this.level=r; }
    this.level += (r-this.level)*Math.min(1,dt/0.12);
    var L=this.level;
    if(L<this.floor) this.floor=L; else this.floor += (L-this.floor)*Math.min(1,dt/25);
    if(L>this.peak) this.peak=L; else this.peak += (L-this.peak)*Math.min(1,dt/12);
    if(this.peak<this.floor*1.6) this.peak=this.floor*1.6;
    this.env=Math.max(0,Math.min(1,(L-this.floor)/(this.peak-this.floor)));
  },
  /* tgt: 0〜1 の息の強さ。吐く間に0.6秒でなめらかに上がり、止まると1.2秒で下がる。さらに余韻(1.5秒)で光がゆっくり消える */
  step:function(dt, tgt){
    if(tgt==null){ if(this.on) this.feed(this.rms(),dt); tgt=this.on?this.env:0; }
    this.shown += (tgt-this.shown)*Math.min(1, dt/(tgt>this.shown?0.6:1.2));
    this.out = Math.max(this.shown, this.out*Math.exp(-dt/1.5));
    return this.out;
  }
};

/* ===== 景色を描く ===== */
Y.Engine = function(canvas, opts){
  opts=opts||{};
  var gl=canvas.getContext("webgl",{antialias:false,alpha:false,preserveDrawingBuffer:!!opts.keep,powerPreference:"low-power"});
  this.gl=gl; this.canvas=canvas; this.progs={}; this.scene=null;
  this.rip=new Float32Array(96); for(var i=0;i<32;i++) this.rip[i*3+2]=-1; this.ripN=0;
  this.dim=1; this.breath=0; this.touch=0; this.time=0;
  this.scale=opts.scale||Math.min(window.devicePixelRatio||1,2);
  if(!gl) return;
  var buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
};
Y.Engine.prototype.prog=function(s){
  var gl=this.gl; if(this.progs[s.id]) return this.progs[s.id];
  function sh(type,src){ var o=gl.createShader(type); gl.shaderSource(o,src); gl.compileShader(o);
    if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)) throw new Error(s.id+": "+gl.getShaderInfoLog(o)); return o; }
  var pr=gl.createProgram();
  gl.attachShader(pr,sh(gl.VERTEX_SHADER,"attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}"));
  gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,HEADER+s.glsl+"\n"+FOOTER));
  gl.linkProgram(pr);
  var U={}, names=["uRes","uTime","uDim","uGain","uBrE","uTouch","uRip"].concat(Object.keys(s.uniforms||{}));
  names.forEach(function(n){ U[n]=gl.getUniformLocation(pr,n); });
  var P={pr:pr,U:U,loc:gl.getAttribLocation(pr,"p")};
  this.progs[s.id]=P; return P;
};
Y.Engine.prototype.setScene=function(id){
  var s=Y.scenes.filter(function(x){return x.id===id;})[0]; if(!s) return;
  this.scene=s; for(var i=0;i<32;i++) this.rip[i*3+2]=-1;
  if(this.gl) this.prog(s);
};
Y.Engine.prototype.resize=function(){
  var c=this.canvas, w=Math.round(c.clientWidth*this.scale), h=Math.round(c.clientHeight*this.scale);
  if(w&&h&&(c.width!==w||c.height!==h)){ c.width=w; c.height=h; }
};
/* 画面上の位置(左上0〜1)で触れた。景色が「そこは波紋が出ない」と言えば何もしない */
Y.Engine.prototype.addRipple=function(x,y){
  var s=this.scene; var ux=x, uy=1-y;
  if(s&&s.canRipple&&!s.canRipple(ux,uy,this.canvas.clientWidth/this.canvas.clientHeight)) return false;
  var k=(this.ripN++%32)*3; this.rip[k]=ux; this.rip[k+1]=uy; this.rip[k+2]=this.time; return true;
};
Y.Engine.prototype.draw=function(t){
  var gl=this.gl, s=this.scene; if(!gl||!s) return;
  this.time=t; this.resize();
  var P=this.prog(s), U=P.U;
  gl.viewport(0,0,this.canvas.width,this.canvas.height);
  gl.useProgram(P.pr);
  gl.enableVertexAttribArray(P.loc); gl.vertexAttribPointer(P.loc,2,gl.FLOAT,false,0,0);
  gl.uniform2f(U.uRes,this.canvas.width,this.canvas.height);
  gl.uniform1f(U.uTime,t); gl.uniform1f(U.uDim,this.dim); gl.uniform1f(U.uGain,Y.GAIN);
  gl.uniform1f(U.uBrE,this.breath); gl.uniform1f(U.uTouch,this.touch); gl.uniform3fv(U.uRip,this.rip);
  var un=s.uniforms||{}, dyn=s.update?s.update(t,this):null;
  for(var k in un){ var v=(dyn&&dyn[k]!=null)?dyn[k]:un[k]; if(U[k]==null) continue;
    if(typeof v==="number") gl.uniform1f(U[k],v); else if(v.length===2) gl.uniform2fv(U[k],v); else if(v.length===3) gl.uniform3fv(U[k],v); }
  gl.drawArrays(gl.TRIANGLES,0,3);
};
/* 使う時間の暗くなり方(3分そのまま → 終わりに向けて暗く → 真っ黒) */
Y.dimAt=function(t,total){ var hold=Math.min(180,total*0.2); if(t<=hold) return 1; var x=Math.min(1,(t-hold)/(total-hold)); return Math.pow(1-x,1.6); };
})();

2.0*3.1416*0.08*0.08);\n   float g1=mix(glitCell(ci,sl0,sreq,sig,dlt),glitCell(ci,sl0+1.0,sreq,sig,dlt),fr)*shape;\n   gl+=g1*(q==0?1.0-lf:lf);\n  }\n  float msk=smoothstep(0.42,0.68,noise(P*vec2(0.5,0.25)+vec2(3.1,-t*0.06))*0.7+noise(P*vec2(1.1,0.55)+vec2(-t*0.05,1.7))*0.3);\n  float mk=mix(1.0,msk*3.0,uMot); float gt=min(1.0,uBrE*mk); float lX=mix(uLife,1.0,uTW); float cX=mix(1.0,0.7,uTW);\n  float glX=glitLayer(P,l0,lf,t,lX,5.3,cX,sreq,sig,dlt,gt,min(uK,1.0))+glitLayer(P,l0,lf,t,lX,2.1,cX,sreq,sig,dlt,gt,clamp(uK-1.0,0.0,1.0))+glitLayer(P,l0,lf,t,lX,7.7,cX,sreq,sig,dlt,gt,clamp(uK-2.0,0.0,1.0));\n  float cs=0.01*exp2(l0);\n  float lod=smoothstep(0.6,0.15,fp/max(-d.y,0.02)*0.0+fp/2.5)*uSpk;\n  float stk=noise(vec2(P.x/(cs*14.0)+t*0.01,P.y/(cs*1.2)+0.3*sin(P.x/(cs*9.0))));\n  float streak=smoothstep(0.35,0.85,stk)*2.2;\n  float G=mix(smoothG*mix(1.0,streak,smoothstep(0.0,0.6,1.0-lod)),gl+glX,lod);\n  G*=(sig2+dlt*dlt)/(sig20+dlt*dlt);\n  float hzFade=smoothstep(0.0,0.012,dz);\n  vec3 moonL=moonCol*uExp*Fm/max(4.0*max(cv,0.22)*pow(hv.y,4.0),0.05);\n  vec3 refl=moonL*G*hzFade;\n  float capL=0.26*0.55; refl=refl/(1.0+refl/(moonCol*capL));\n  vec2 sreq0=vec2(-hv.x/hv.y,-hv.z/hv.y); float s2w=uSig*3.0+lost+dlt*dlt; float glowG=(dlt*dlt/s2w)*exp(-dot(sreq0,sreq0)/(2.0*s2w));\n  vec3 gwl=moonL*glowG*hzFade*uGW*uBrE; gwl=gwl/(1.0+gwl/(moonCol*capL*0.5)); refl+=gwl*clamp(1.0-refl.r/(moonCol.r*capL),0.0,1.0);\n  col=sea+refl*(1.0+uBrA*uBrE);\n  col+=moonCol*0.011*max(0.0,rw)*hzFade;\n  col+=vec3(0.010,0.0062,0.0042)*exp(-dz*40.0)*0.45;\n }\n float vig=smoothstep(1.3,0.3,length((uv-vec2(0.5,0.6))*vec2(asp,1.0)));\n col*=mix(0.6,1.0,vig);\n return col;\n}"

/* 雨の窓(部屋の内側から夜の窓を見る。奥の灯りは大きな丸いぼけ。ガラスには雨粒、大きい粒だけがゆっくり滑って筋を残す)

   触る: なぞった所の内側の曇りが拭われて澄む(しばらく残って端から曇り直す)。触れた所の近くの雨粒がゆっくり滑り落ちる */
Yorumi.registerScene({
  id:"rain", name:"雨の窓", sub:"窓をつたう雨", free:true, order:2,
  canRipple:function(x,y,aspect){ return true; },
  uniforms:{ uT0:[0,0,-99], uT1:[0,0,-99], uT2:[0,0,-99] },
  /* 触れ始め(前に触れてから0.5秒以上あいた点)だけを、滑り落ちる粒の場所として3つまで覚える */
  update:function(t,eng){
    var st=this._st;
    if(!st || t<st.t-1){ st=this._st={t:t,last:-1,prev:-99,slot:0,T:[[0,0,-99],[0,0,-99],[0,0,-99]]}; }
    st.t=t;

    for(var i=0;i<32;i++){ var z=r[i*3+2]; if(z>st.last) nw.push([r[i*3],r[i*3+1],z]); }
    nw.sort(function(a,b){return a[2]-b[2];});
    for(var k=0;k<nw.length;k++){
      var n=nw[k];
      if(n[2]-st.prev>0.5){ st.T[st.slot]=[n[0],n[1],n[2]]; st.slot=(st.slot+1)%3; }
      st.prev=n[2]; if(n[2]>st.last) st.last=n[2];

    return { uT0:st.T[0], uT1:st.T[1], uT2:st.T[2] };
  },
  glsl: `
uniform vec3 uT0,uT1,uT2;
float ASP, PX, HZ;
const float FIELD=0.16;

/* 窓の外の灯り(位置 q: 横0〜ASP, 縦0〜1。R=ぼけの半径) */
const vec3 C_OR=vec3(1.0,0.40,0.12); const vec3 C_AM=vec3(1.0,0.52,0.19); const vec3 C_YE=vec3(1.0,0.63,0.27);

void lightI(int i,out vec2 p,out float R,out vec3 c,out float I){
 if(i==0){p=vec2(0.10,0.55);R=0.052;c=C_OR;I=0.42;}
 else if(i==1){p=vec2(0.30,0.47);R=0.030;c=C_AM;I=0.50;}
 else if(i==2){p=vec2(0.21,0.52);R=0.016;c=C_YE;I=0.80;}
 else if(i==3){p=vec2(0.235,0.505);R=0.011;c=C_AM;I=0.70;}
 else if(i==4){p=vec2(0.40,0.53);R=0.013;c=C_OR;I=0.55;}
 else if(i==5){p=vec2(0.03,0.47);R=0.009;c=C_YE;I=0.45;}
 else if(i==6){p=vec2(0.36,0.44);R=0.020;c=C_OR;I=0.50;}
 else if(i==7){p=vec2(0.16,0.45);R=0.010;c=C_AM;I=0.60;}
 else if(i==8){p=vec2(0.44,0.36);R=0.024;c=C_AM;I=0.40;}
 else if(i==9){p=vec2(0.07,0.78);R=0.014;c=C_YE;I=0.42;}
 else if(i==10){p=vec2(0.12,0.81);R=0.008;c=C_OR;I=0.35;}
 else if(i==11){p=vec2(0.40,0.27);R=0.017;c=C_OR;I=0.35;}
 else if(i==12){p=vec2(0.27,0.56);R=0.008;c=C_AM;I=0.50;}
 else {p=vec2(0.33,0.50);R=0.009;c=C_YE;I=0.65;}

vec3 skyAt(vec2 q){

/* ぼけた灯り。bl=ぼけ・にじみの強さ(0=澄んだガラス 1=曇ったガラス) */
vec3 bokeh(vec2 q,float bl,out vec3 glow){

  vec2 p; float R; vec3 c; float I; lightI(i,p,R,c,I);

/* 雨粒の中: 粒は小さなレンズで、奥の景色が逆さまに小さく映る(灯りの近くの粒だけ光の点が入る) */

  vec2 p; float R; vec3 lc; float I; lightI(i,p,R,lc,I);

 col*=1.0-0.80*smoothstep(mix(0.55,0.30,bot),1.0,L);
 vec2 hp=o-vec2(-0.28,0.42); float hs=max(0.13,0.8*PX/r);
 col+=(amb*2.2+vec3(0.0012,0.0011,0.0010))*exp(-dot(hp,hp)/(hs*hs));

mat2 transpose2(mat2 m){return mat2(m[0][0],m[1][0],m[0][1],m[1][1]);}
void takeDrop(float mk,vec2 o,vec2 c,float r,inout float m,inout vec2 oo,inout vec2 cc,inout float rr){
 if(mk>0.02){ m=max(m,mk); oo=o; cc=c; rr=r; }

/* 止まっている粒(格子1つにつき1粒) */
void staticLayer(vec2 q,float cs,float sd,float dens,float r0,float r1,float clr,inout float m,inout vec2 oo,inout vec2 cc,inout float rr){
 vec2 g=q/cs+sd; float an=sd*0.37; mat2 rot=mat2(cos(an),-sin(an),sin(an),cos(an)); g=rot*g; vec2 id=floor(g); vec2 f=fract(g);
 if(hash(id+sd*1.7+3.1)>dens) return;
 float rad=mix(r0,r1,pow(hash(id+5.3+sd),2.2));
 vec2 h=hash2(id+sd);
 vec2 ctr=0.5+(h-0.5)*2.0*(0.5-rad-0.03);
 vec2 d=f-ctr; d.x*=1.0+0.30*(hash(id+9.1+sd)-0.5);
 float L=length(d)/rad;
 float rp=rad*cs;
 float aa=(1.3*PX+HZ*0.35*rp)/rp;
 float mk=smoothstep(1.0,1.0-aa,L)*(1.0-clr);
 vec2 cw=(transpose2(rot)*(id+ctr))*cs-sd*cs;
 takeDrop(mk,d/rad,cw,rp,m,oo,cc,rr);
}
float pathX(float y,float x0,float sd){
 return x0+0.020*(noise(vec2(y*6.0,sd*13.0))-0.5)+0.007*(noise(vec2(y*21.0,sd*5.0))-0.5);
}
/* 滑る粒: s=滑り始めからの秒(負=まだ止まっている)。ys=出発の高さ。al=見えている割合。gr=育ち具合 */
void slider(vec2 q,float x0,float ys,float s,float vmax,float R,float sd,float al,float gr,
            inout float m,inout vec2 oo,inout vec2 cc,inout float rr,inout float clr,inout float riv){
 if(al<0.001 || abs(q.x-x0)>0.045) return;
 const float RAMP=2.2;
 float sp=max(s,0.0);
 float dist= sp<RAMP ? vmax*sp*sp/(2.0*RAMP) : vmax*(sp-0.5*RAMP);
 float mv=smoothstep(0.0,RAMP,s);
 float yc=ys-dist; float xc=pathX(yc,x0,sd);
 float Re=R*gr;
 vec2 o=(q-vec2(xc,yc))/max(Re,1e-4);
 o.y*= o.y>0.0 ? mix(0.95,0.68,mv) : 1.05;
 float L=length(o);
 float mk=smoothstep(1.0,1.0-(1.3*PX+HZ*0.35*Re)/max(Re,1e-4),L)*al;
 takeDrop(mk,o,vec2(xc,yc),Re,m,oo,cc,rr);
 /* 通った跡: 粒が拭い取った細い道と、細い水の筋、残った小さな粒 */
 if(q.y>yc && q.y<ys+R){
  float tx=pathX(q.y,x0,sd); float dx=q.x-tx;
  float span=smoothstep(yc,yc+R*1.2,q.y)*smoothstep(ys+R,ys,q.y)*al;
  clr=max(clr,smoothstep(R*0.95,R*0.55,abs(dx))*span);
  riv=max(riv,smoothstep(R*0.22,R*0.05,abs(dx))*span);
  float bc=0.016; float bi=floor(q.y/bc);
  if(hash(vec2(bi,sd*3.3))<0.55){
   float by=(bi+0.3+0.4*hash(vec2(bi,sd+1.0)))*bc;
   if(by>yc+R*1.5 && by<ys){
    float br=R*mix(0.22,0.40,hash(vec2(bi,sd+2.0)));
    vec2 bcn=vec2(pathX(by,x0,sd)+(hash(vec2(bi,sd+4.0))-0.5)*R*0.5,by);
    vec2 bo=(q-bcn)/br;
    takeDrop(smoothstep(1.0,1.0-1.3*PX/br,length(bo))*al,bo,bcn,br,m,oo,cc,rr);
   }
  }
 }
}
/* 拭った所(内側の曇りが取れる)。触れて0.6秒で澄み、5秒ほどそのまま、そのあと端から曇り直す */
float wipeAt(vec2 q,float t,out float edge){
 float w=0.0;
 for(int i=0;i<32;i++){
  vec3 a=uRip[i]; float age=t-a.z;
  if(a.z<0.0 || age<0.0 || age>26.0) continue;
  vec2 pa=vec2(a.x*ASP,a.y);
  float d=length(q-pa);
  if(i<31){
   vec3 b=uRip[i+1];
   if(b.z>a.z && b.z-a.z<0.15){
    vec2 pb=vec2(b.x*ASP,b.y); vec2 ab=pb-pa; float h=clamp(dot(q-pa,ab)/max(dot(ab,ab),1e-6),0.0,1.0);
    d=length(q-pa-ab*h);
   }
  }
  float rad=0.024*(1.0-0.80*smoothstep(5.0,24.0,age));
  float n=0.005*(noise(q*90.0)-0.5)+0.004*(noise(q*vec2(30.0,220.0))-0.5);
  float k=smoothstep(rad,rad*0.45,d+n)*smoothstep(0.0,0.6,age)*smoothstep(26.0,18.0,age);
  w=max(w,k);
 }
 edge=w*(1.0-w)*4.0;
 return w;
}

vec3 sceneColor(vec2 frag){

  float fk=float(k);

  float tk=t+P*hash(vec2(fk,8.1))+40.0;
  float cy=floor(tk/P); float s=tk-cy*P;
  float x0=0.035+(ASP-0.07)*hash(vec2(cy,fk+0.5));
  float ys=0.55+0.40*hash(vec2(cy+0.3,fk));
  float al=smoothstep(0.0,2.5,s)*smoothstep(P,P-5.0,s);
  float gr=0.35+0.65*smoothstep(0.0,3.0,s);
  float R=0.0125+0.0055*hash(vec2(cy,fk+9.0));

 }

 for(int k=0;k<3;k++){
  vec3 T= k==0?uT0:(k==1?uT1:uT2);
  float s=t-T.z;
  if(T.z<0.0 || s<0.0 || s>24.0) continue;
  float al=smoothstep(0.0,0.6,s)*smoothstep(24.0,19.0,s);
  float gr=0.45+0.55*smoothstep(0.0,1.0,s);
  slider(q,T.x*ASP,T.y-0.015,s-0.9,0.0115,0.0140,37.0+float(k)+floor(T.z*7.0),al,gr,m,oo,cc,rr,clr,riv);
 }
 if(m<0.02){
  staticLayer(q,0.032,0.0,0.80,0.07,0.45,clr,m,oo,cc,rr);
  if(m<0.02) staticLayer(q,0.016,17.3,0.88,0.09,0.42,clr,m,oo,cc,rr);
  if(m<0.02) staticLayer(q,0.0085,41.9,0.42,0.14,0.40,clr,m,oo,cc,rr);
 }

 col=col*(1.0-0.22*hz)+veil*hv+vec3(0.0009,0.0011,0.0013)*gtex*fog*(1.0-wp);

 col+=(glow*0.10+vec3(0.0036,0.0035,0.0032))*edge;
 if(edge>0.05){
  vec2 g=q/0.0050; vec2 id=floor(g); vec2 f=fract(g);
  if(hash(id+77.0)<0.70){

   vec2 bo=(f-ctr)/br; float bl2=length(bo);
   float mk=smoothstep(1.0,0.55,bl2)*smoothstep(0.15,0.65,edge);
   vec3 bc=(vec3(0.0085,0.0080,0.0073)+glow*0.40)*(0.55+0.9*smoothstep(0.2,-0.7,bo.y));
   vec2 hp=bo-vec2(-0.3,0.35);
   vec3 add=(glow*1.1+vec3(0.0120,0.0112,0.0100))*exp(-dot(hp,hp)/0.08);
   add=add/(1.0+add.r/0.12);

 col*=mix(0.65,1.0,vig);
 return col;
}

/* まわりを照らす光: 色の少ない光(灰を灰色に見せる)と、炎の近くの橙 */
" float near=1.0/(1.0+pow(length((G-vec2(0.0,0.02))*vec2(1.0,1.1))/0.48,2.0));",
" vec3 Ilit=vec3(1.0,0.87,0.78)*0.104*pw*near+vec3(1.0,0.5,0.2)*0.03*tchB;",
" vec2 d0=q-F0-vec2(0.0,0.02); vec2 d1=q-F1-vec2(0.0,0.015);",
" Ilit+=vec3(1.0,0.62,0.32)*0.014*fh/(1.0+dot(d0,d0)/(0.06*0.06));",
" Ilit+=vec3(1.0,0.62,0.32)*0.010*fh/(1.0+dot(d1,d1)/(0.05*0.05));",
" vec3 night=vec3(0.0026,0.0027,0.0032);",
/* 火の外の地面: 暗い土 */
" float gt=noise(G*30.0+1.7)*0.6+noise(G*90.0)*0.4;",
" vec3 col=vec3(0.07,0.065,0.06)*(0.5+gt)*(Ilit*0.6+night);",
" vec3 em=vec3(0.0);",
/* 炭の床: 大きい塊と小さい塊を重ね、すき間の奥ほど明るく光る */
" if(inBed>0.0){",
"  vec2 gp=vec2(G.x,G.y*0.80);",
"  vec2 w1=0.40*(vec2(noise(gp*9.0),noise(gp*9.0+7.0))-0.5)+0.10*(vec2(noise(gp*31.0),noise(gp*31.0+3.0))-0.5);",
"  vec4 v1=vor(gp/0.085+w1); float id1=v1.w;",
"  float pr1=step(0.25,hash(vec2(id1,1.3)));",
"  float gw1=(0.025+0.05*hash(vec2(id1,2.1)))*(0.6+0.8*noise(gp*11.0));",
"  float in1=smoothstep(gw1,gw1+0.025,v1.z)*pr1;",
"  vec4 v2=vor(gp/0.036+5.0+w1*1.5); float id2=v2.w;",
"  float pr2=step(0.06,hash(vec2(id2,1.7)));",
"  float gw2=(0.030+0.05*hash(vec2(id2,2.9)))*(0.6+0.8*noise(gp*14.0+3.0));",
"  float in2=smoothstep(gw2,gw2+0.035,v2.z)*pr2*(1.0-in1);",
"  float gap=clamp(1.0-in1-in2,0.0,1.0);",
/* すき間の深さ: 塊のふちから離れるほど深い。大きい塊が無い所はさらに奥 */
"  float dg=clamp(1.0-v2.z/max(gw2,0.02),0.0,1.0)*pr2+(1.0-pr2)*(0.25+0.6*noise(gp*30.0+id2*9.0));",
"  float deep=mix(0.35,1.0,dg)*mix(1.0,1.15,1.0-pr1);",
"  float tex=0.75+0.5*noise(q*R.y*0.35);",
/* 塊の表面: 黒〜白っぽい灰色(色を付けない)。面ごとに明るさが違う */
"  float f1=facet(v1.xy,id1), f2=facet(v2.xy,id2);",
"  float ash1=smoothstep(0.15,0.85,0.55*noise(gp/0.085*4.5+id1*10.0)+0.45*noise(gp/0.085*10.0+id1*3.0)+0.25*(hash(vec2(id1,5.0))-0.5))*(1.0-0.8*tchB);",
"  float ash2=smoothstep(0.15,0.85,0.6*noise(gp/0.036*3.0+id2*10.0)+0.4*noise(gp/0.036*7.0))*(1.0-0.8*tchB);",
"  float e1=smoothstep(gw1,gw1+0.22,v1.z), e2=smoothstep(gw2,gw2+0.25,v2.z);",
"  float sp1=smoothstep(0.35,0.85,noise(gp/0.085*9.0+id1*3.0));",
"  vec3 c1=mix(vec3(0.016),vec3(0.34,0.335,0.33),ash1*(1.0-0.25*sp1))*tex*(0.25+0.95*f1)*(0.35+0.65*e1);",
"  vec3 c2=mix(vec3(0.014),vec3(0.30,0.295,0.29),ash2)*tex*(0.20+0.80*f2)*0.75*(0.4+0.6*e2);",
"  vec3 cCol=(c1*in1+c2*in2)*Ilit;",
/* 塊のふち(手前の下側の奥)が赤く光る */
"  float rim1=(1.0-smoothstep(gw1,gw1+0.06,v1.z))*smoothstep(0.1,-0.3,v1.y*1.0)*in1;",
"  float rim2=(1.0-smoothstep(gw2,gw2+0.08,v2.z))*in2;",
"  float Tsur=T*(0.05*(1.0-ash1)*in1+(0.18*(1.0-ash2))*in2)+T*(0.55*rim1+0.75*rim2);",
"  float rd=1.0-abs(2.0*noise(gp/0.085*2.6+id1*7.0)-1.0);",
"  Tsur=max(Tsur,T*0.85*smoothstep(0.90,0.975,rd)*e1*in1*(1.0-0.6*ash1));",
"  Tsur+=tchB*(1.0*in1*(1.0-ash1*0.5)+1.0*in2);",
"  float Tgap=T*deep*(0.55+0.55*smoothstep(0.25,0.75,noise(gp*14.0+5.0)));",
"  vec3 bed=cCol+emitC(Tsur)+emitC(Tgap)*gap;",
"  col=mix(col,bed*(1.0-0.75*farD),inBed);",
" }",
/* 燃えかけの薪2本(奥から手前へ)。焦げて亀の甲羅のように割れ、割れ目の内側が光る */
" vec3 L0,L1;",
" float c0=logCov(q,vec2(-0.330,0.405),vec2(0.100,0.285),0.050,px,L0);",
" float c1=logCov(q,vec2(0.330,0.115),vec2(-0.045,0.232),0.056,px,L1);",
" float cv=max(c0,c1); vec3 L=L0; float lid=0.0;",
" if(c1>=0.5||c1>=c0){L=L1;lid=1.0;}",
" if(cv>0.0){",
"  float v=clamp(L.y,-0.985,0.985); float th=asin(v); float fac=sqrt(max(0.0,1.0-v*v));",
"  float uS=L.x/L.z;",
/* 乾いた泥のひび割れのような不規則な多角形。長さ方向に少し伸び、丸みに沿って曲がる */
"  vec2 bc=vec2(uS*0.80,th*1.15)+lid*9.0;",
"  bc+=0.45*(vec2(noise(bc*1.1),noise(bc*1.1+4.0))-0.5)+0.12*(vec2(noise(bc*3.7),noise(bc*3.7+2.0))-0.5);",
"  vec4 vl=vor(bc); float edge=vl.z*0.5; float bid=vl.w;",
"  float fadeE=smoothstep(0.97,0.75,abs(v));",
"  float lower=smoothstep(0.35,-0.95,v);",
"  float Tl=T*(0.40+1.00*lower)*(0.85+0.3*bid);",
"  float cw=(0.022+0.024*clamp(Tl,0.0,1.8))*(0.55+0.9*noise(vec2(uS*1.7,th*2.5+lid)));",
"  float cdep=clamp(1.0-edge/cw,0.0,1.0);",
"  float crack=smoothstep(0.0,0.5,cdep)*fadeE;",
"  float hB=smoothstep(0.0,0.12,edge);",
"  float ashL=smoothstep(0.40,0.90,fbm(vec2(uS*2.2,th*3.4)+lid*5.0)+0.50*v+0.15*(bid-0.5))*hB*(1.0-0.75*tchB);",
"  float tex=0.75+0.5*noise(q*R.y*0.35);",
"  vec3 lAlb=mix(vec3(0.020)*(0.7+0.6*bid),vec3(0.33,0.325,0.32),ashL)*tex;",
"  float sh=(0.18+0.82*smoothstep(-0.7,0.6,v))*pow(fac,0.35);",
"  vec3 lCol=lAlb*(Ilit*sh+night*fac)*(0.45+0.55*hB);",
"  float Tsurf=Tl*(0.03+0.10*bid)*(1.0-0.9*ashL)*hB*lower+tchB*0.90*(0.5+0.5*bid)*hB;",
"  float Trim=Tl*0.22*exp(-edge/0.03)*(1.0-crack)*fadeE;",
"  float Tcr=Tl*(0.35+0.95*cdep*cdep)*crack;",
"  vec3 lEm=emitC(max(Tcr,max(Tsurf,Trim)));",
"  float sil=0.35+0.65*pow(fac,0.5);",
"  col=mix(col,lCol*sil+lEm*mix(0.6,1.0,fac),cv);",
" }",
/* 光のにじみ(炭の上にうっすら) */
" col+=emitC(H*(1.0+0.65*brE))*0.035*inBed;",
/* 小さな炎 */
" col+=flame(q,F0,0.050*fh,0.014*(1.0+0.20*brE),1.0,t)*(1.0+0.35*brE);",
" col+=flame(q,F1,0.036*fh,0.012*(1.0+0.20*brE),4.0,t)*(1.0+0.35*brE);",
" float f2=smoothstep(0.15,0.7,brE);",
" col+=flame(q,F2,0.030*f2+0.002,0.010,7.0,t)*f2;",
/* 火の粉: ふだんは、まれに1つ */
" float sp=0.0;",
" for(int i=0;i<3;i++){",
"  float fi=float(i); float P=7.0+2.3*fi; float tt=t+fi*3.1+2.0; float k=floor(tt/P); float a=tt-k*P;",
"  vec2 hh=hash2(vec2(k*1.7+fi,fi*9.1));",
"  if(hh.x<0.40||a>4.8) continue;",
"  vec2 p=vec2((hh.y-0.5)*0.26,0.30+0.08*hash(vec2(k,fi)))+vec2(0.008*sin(a*1.0+hh.y*6.0),0.0155*a*(1.0-0.04*a));",
"  sp+=sparkAt(q,p,px)*smoothstep(0.0,0.6,a)*(1.0-smoothstep(1.8,4.6,a));",
" }",
" sp+=touchSparks(q,uSp0,t,px,asp)+touchSparks(q,uSp1,t,px,asp)+touchSparks(q,uSp2,t,px,asp)+touchSparks(q,uSp3,t,px,asp);",
" col+=vec3(0.20,0.14,0.05)*sp;",
/* 上の暗い所: 火の上の空気がほのかに赤く照らされる(形は見えないほど淡く、動かない) */
" float up=max(q.y-0.36,0.0);",
" col+=vec3(1.0,0.34,0.10)*0.0140*pw*exp(-up/0.22)*exp(-abs(q.x)*1.2)*smoothstep(0.30,0.42,q.y);",
" col+=night*0.30*smoothstep(0.5,1.0,q.y);",
/* 一番明るい所を抑える(色を変えずになめらかに) */
" float mx=max(col.r,max(col.g,col.b)); col*=1.0/pow(1.0+pow(mx/0.195,4.0),0.25);",
" return col;",
"}"
  ].join("\n")
});

</script><script>
/* 雪の夜(暗い通りに街灯が1本。光の中だけで雪が見える。息で手前の雪が流されて舞い上がり、触るとその周りの雪がふわっとよける) */
Yorumi.registerScene({
  id:"snow", name:"雪の夜", sub:"街灯の下に降る雪", free:false, order:4,
  canRipple:function(x,y,aspect){ return true; },
  uniforms:{ uWind:0 },
  /* 息を吐いた量を積み上げる(手前の雪を横・上へ流す量) */
  update:function(t,eng){
    var dt=Math.max(0,Math.min(0.1,t-(this._t==null?t:this._t))); this._t=t;
    this._w=(this._w||0)+eng.breath*dt;
    return { uWind:this._w };
  },
  glsl: [
"uniform float uWind;",
"const float FK=1.0;",                       // 画面の高さ1 = 奥行き1mあたり1mの広がり
"const float HZ=0.36;",                      // 地平の高さ
"const float EYE=1.6;",                      // 目の高さ(m)
"const vec3 LP=vec3(-0.10,2.75,7.0);",        // 街灯の電球の位置(目から見て m)
"const vec3 LCOL=vec3(1.0,0.46,0.13);",      // 古い街灯の橙
"const float PX=-0.80; const float PZ=7.0;", // 柱の位置
"float gAsp; vec2 gC;",
"float lampF(vec3 v){ float d=length(v); float c=-v.y/max(d,1e-4);",
"  float m=max(c,0.0); float m4=m*m; m4*=m4; float m8=m4*m4; return m8*smoothstep(0.91,0.97,c)*2.6+0.05*smoothstep(-0.1,0.35,c); }",
"vec3 lightAt(vec3 P){ vec3 v=P-LP; float d2=dot(v,v); return LCOL*lampF(v)/(d2+0.25); }",
"vec3 toWorld(vec2 s,float z){ return vec3((s.x-gC.x)*FK*z,(s.y-HZ)*FK*z,z); }",
// 雪の層: p=画面の位置(高さ1の単位), sc=触った所の広がりの補正
"vec3 snowLayer(vec2 p,mat2 Mi,vec3 st,float z,float cell,float spd,float sz0,float dens,float sway,float ang,float gain,float zMax,float kick,float seed){",
"  if(z*0.82>zMax) return vec3(0.0);",
"  float ca=cos(ang), sa=sin(ang); mat2 Rt=mat2(ca,sa,-sa,ca); mat2 RtT=mat2(ca,-sa,sa,ca);",   // 層ごとに並びの向きを変えて格子を隠す
"  vec2 g=Rt*((p+vec2(0.0,uTime*spd))/cell)+vec2(seed*3.7,seed*1.9);",
"  vec2 gi=floor(g-0.5); vec3 acc=vec3(0.0); float px=1.0/uRes.y;",
"  for(int j=0;j<2;j++){ for(int i=0;i<2;i++){",
"    vec2 id=gi+vec2(float(i),float(j));",
"    if(hash(id+seed*3.3)>dens) continue;",
"    vec2 h=hash2(id+seed*7.1);",
"    vec2 c=id+0.5+(h-0.5)*0.72;",
"    vec2 dv=RtT*((g-c)*cell);",
"    float w=0.45+0.5*hash(id.yx+seed*1.3); float ph=hash(id+seed*9.1)*6.283;",
"    dv-=vec2(sway*sin(uTime*w+ph),0.35*sway*sin(uTime*w*0.7+ph*1.7));",
"    float zf=z*(0.82+0.36*hash(id+seed*5.3)); if(zf>zMax) continue;",           // 1粒ずつ奥行きを少しずつ変える
"    float hs=hash(id+seed*2.9); float sz=sz0*(0.45+0.6*hs+1.1*hs*hs*hs*hs);",     // 大きさはばらばら(小さい粒が多く、大きい粒は少ない)
"    float b=70.0*abs(1.0/zf-0.133)*px;",                                           // ピントは灯りの少し奥。手前ほど大きくぼける
"    float R=sqrt(sz*sz+b*b);",
"    float L=min(st.z,max(0.45*cell/R-1.0,0.0));",                                // 息の風で横へ流れる筋
"    vec2 e=Mi*dv; float al=dot(e,st.xy)/(1.0+L); float pe=dot(e,vec2(-st.y,st.x));",
"    float r=sqrt(al*al+pe*pe);",
"    if(r>R*1.5) continue;",
"    float k=smoothstep(1.5*px,6.0*px,b);",
"    float sh=mix(exp(-r*r/(R*R)),smoothstep(R,R*0.8,r)*(0.85+0.15*r*r/(R*R)),k);",
"    float en=pow(sz/R,1.3)/(1.0+0.45*L);",
"    float tw=(0.72+0.28*sin(uTime*(0.5+0.7*h.x)+ph*3.0))*(0.35+0.65*hash(id+seed*4.3));",
"    vec3 P=toWorld(p-dv,zf);",
"    float kA=kick<0.0?1.0:smoothstep(hs*0.7,hs*0.7+0.3,kick)*smoothstep(-0.2,-1.3,P.y);",
"    float fw=max(dot(normalize(P-LP),normalize(-P)),0.0); fw*=fw; fw*=fw; fw*=fw; fw*=fw;",
"    acc+=lightAt(P)*sh*en*tw*kA*(0.45+4.0*fw);",
"  }}",
"  return acc*gain;",
"}",
// 触った所・息で雪を動かした時に、雪片の形がゆがまないように戻す
"mat2 invM(mat2 J,float tw,float bx){ mat2 M=mat2(1.0)-J*tw-mat2(bx,0.0,0.0,0.0);",
"  return mat2(M[1][1],-M[0][1],-M[1][0],M[0][0])/max(M[0][0]*M[1][1]-M[0][1]*M[1][0],0.15); }",
"vec3 sceneColor(vec2 frag){",
"  vec2 uv=frag/uRes.y; gAsp=uRes.x/uRes.y; gC=vec2(gAsp*0.5,HZ);",
"  float t=uTime; float px=1.0/uRes.y;",
"  vec2 q=vec2(uv.x-gC.x,uv.y-HZ);",
"  vec3 dir=normalize(vec3(q*FK,1.0));",
// 地面までの奥行き
"  float zG=q.y<0.0? EYE/(-q.y*FK) : 1e4;",
// 空
"  float sk=smoothstep(HZ-0.02,1.0,uv.y);",
"  vec3 col=mix(vec3(0.0013,0.0011,0.0013),vec3(0.00040,0.00052,0.0011),sk);",
// 遠くの家の影(屋根の線)と、窓の灯り1つ
"  float zH=24.0; float gH=HZ-EYE/zH;",
"  float hx=(uv.x-gC.x)*zH;",
"  float roof=0.0;",
"  { float cx=floor(hx/7.0); float fx=hx-cx*7.0-3.5; float hh=4.2+1.6*hash(vec2(cx,3.0)); float wd=2.6+0.6*hash(vec2(cx,5.0));",
"    float ridge=hh-abs(fx)*0.55; float edge=step(abs(fx),wd); roof=max(roof,edge*min(ridge,hh)); }",
"  float roofY=HZ+(roof-EYE)/zH;",
"  float isHouse=step(uv.y,roofY)*step(gH,uv.y)*step(0.5,roof);",
"  col=mix(col,vec3(0.00018,0.00016,0.00018),isHouse);",
"  vec2 wc=vec2(gC.x+3.0/zH,HZ+(2.2-EYE)/zH); vec2 wd2=abs(uv-wc)-vec2(0.20,0.26)/zH;",
"  float win=smoothstep(px,-px,max(wd2.x,wd2.y))*(1.0-0.75*smoothstep(0.6*px,0.0,abs(uv.x-wc.x)));",
"  float winG=exp(-length((uv-wc)*vec2(1.0,1.3))*90.0);",
"  col+=vec3(1.0,0.45,0.14)*(win*0.020+winG*0.0035);",
// 地面(積もった雪): 灯りの真下だけほのかに照らされる
"  if(q.y<0.0){",
"    vec3 G=vec3(q.x*FK*zG,-EYE,zG);",
"    vec3 v=G-LP; float d=length(v); float ci=-v.y/d;",
"    vec2 gp=G.xz;",
"    float und=fbm(gp*vec2(0.9,0.7)+3.0); float fine=noise(gp*9.0);",
"    float tr=exp(-pow((G.x-0.55)/0.18,2.0))+exp(-pow((G.x-1.25)/0.18,2.0));",       // 車の跡
"    float sh=0.80+0.30*(und-0.5)+0.06*(fine-0.5)-0.18*tr*smoothstep(30.0,10.0,zG);",
"    vec3 E=lightAt(G)*ci;",
"    vec2 gc=floor(gp*60.0); vec2 gf=fract(gp*60.0)-0.5; float gl=step(0.985,hash(gc))*exp(-dot(gf,gf)*30.0);",
"    vec3 gnd=E*(0.30*sh+0.35*gl*smoothstep(12.0,5.0,zG));",
"    gnd+=vec3(0.00070,0.00070,0.00090)*smoothstep(40.0,4.0,zG)*sh;",
"    if(isHouse<0.5||zG<zH) col=gnd;",
"  }",
// 柱・腕・かさ
"  float pX=gC.x+PX/PZ/FK; float hw=0.065/PZ;",
"  float pTop=HZ+3.05/PZ; float pBot=HZ-EYE/PZ;",
"  float pole=smoothstep(hw+px*0.7,hw-px*0.7,abs(uv.x-pX))*step(pBot,uv.y)*step(uv.y,pTop);",
"  float lX=gC.x+LP.x/LP.z/FK; float lY=HZ+LP.y/LP.z/FK;",
"  float armY=pTop-0.017*smoothstep(pX,lX,uv.x)*smoothstep(pX,lX,uv.x);",
"  float arm=smoothstep(1.6*px,0.6*px,abs(uv.y-armY))*step(pX,uv.x)*step(uv.x,lX);",
"  float shY=(uv.y-(lY+0.005))/0.017; float shW=mix(0.040,0.014,clamp(shY,0.0,1.0))*0.5;",
"  float shade=step(0.0,shY)*step(shY,1.0)*smoothstep(shW+px,shW-px,abs(uv.x-lX));",
"  float solid=max(max(pole,arm),shade);",
"  vec3 pP=vec3(PX+0.065,(uv.y-HZ)*FK*PZ,PZ); vec3 pv=LP-pP; float pl=max(0.0,normalize(pv).x)*smoothstep(-0.5*hw,hw,uv.x-pX);",
"  vec3 poleCol=lightAt(pP)*0.05*(0.25+0.75*pl);",
"  col=mix(col,poleCol,solid);",
// 電線(灯りのもやを背に、ごく細く暗く)
"  float wire=0.0;",
"  { float x0=pX; float y0=pTop-0.004; float dx=uv.x-x0;",
"    float yl=y0+dx*0.10+dx*dx*0.55; float yr=y0-dx*0.16+dx*dx*0.35;",
"    wire=max(smoothstep(0.9*px,0.0,abs(uv.y-yl))*step(uv.x,x0), smoothstep(0.9*px,0.0,abs(uv.y-yr))*step(x0,uv.x)); }",
// 光の中のもや(降る雪で光の円錐がうっすら見える)
"  float T=min(zG/max(dir.z,1e-3),40.0);",
"  float t0=dot(LP,dir); float h2=max(dot(LP,LP)-t0*t0,1e-5); float h=sqrt(h2);",

// 触った所: その周りの雪がよけるように広がって少し舞い上がり、ゆっくり落ち直す
"  vec2 D=vec2(0.0); float W=0.0; vec2 gW=vec2(0.0); mat2 J=mat2(0.0); const float S2=0.085*0.085;",

// 雪(奥から手前へ)

"  vec2 p; mat2 M;",
"  p=uv-D*0.60-B*0.35-wv*0.20; M=invM(J,0.60,0.0); sn+=snowLayer(p,M,vec3(sd,1.0*profS),8.2,11.0*px,5.0*px,0.9*px,0.75,1.5*px,0.35,1.05,zMax,-1.0,1.0);",
"  p=uv-D*0.70-B*0.50-wv*0.30; M=invM(J,0.70,0.0); sn+=snowLayer(p,M,vec3(sd,1.5*profS),7.4,13.0*px,5.5*px,1.0*px,0.75,2.0*px,-0.50,1.05,zMax,-1.0,2.0);",
"  p=uv-D*0.80-B*0.65-wv*0.45; M=invM(J,0.80,0.0); sn+=snowLayer(p,M,vec3(sd,2.0*profS),6.6,16.0*px,6.2*px,1.2*px,0.70,2.5*px,0.90,1.05,zMax,-1.0,3.0);",
"  p=uv-D*0.90-B*0.80-wv*0.60; M=invM(J,0.90,0.0); sn+=snowLayer(p,M,vec3(sd,2.5*profS),5.6,24.0*px,7.2*px,1.5*px,0.60,3.0*px,-1.10,1.0,zMax,-1.0,4.0);",
"  p=uv-D*1.00-B*0.90-wv*0.80; M=invM(J,1.00,0.0); sn+=snowLayer(p,M,vec3(sd,1.5*profS),3.4,60.0*px,10.5*px,2.8*px,0.40,4.0*px,0.20,0.85,zMax,-1.0,5.0);",

// 息: 積もった雪の表面から細かい雪が舞い上がる(灯りの下の地面のすぐ上だけ)
"  p=uv-D*0.80-wv*1.10; M=invM(J,0.80,0.0); sn+=snowLayer(p,M,vec3(sd,2.0*profS),6.5,13.0*px,-5.0*px,1.0*px,0.85,3.0*px,0.60,0.80,zMax,uBrE,7.0);",

/* ろうそく(真っ暗な部屋の1本のろうそく。息で炎が傾いて細く長くなり、触った方へ炎が引かれる) */
Yorumi.registerScene({
  id:"candle", name:"ろうそく", sub:"小さくゆれる火", free:false, order:5,
  canRipple:function(x,y,aspect){ return true; },
  uniforms:{ uFA:0, uFS:[1,1,1], uLit:1, uBs:0 },
  update:function(t,eng){
    var dt=(this._t==null)?0.033:t-this._t; this._t=t; if(!(dt>0&&dt<0.2)) dt=0.033;
    var S=Math.sin, P2=6.2832;

    var slow=0.55*S(P2*0.21*t+1.3)+0.30*S(P2*0.37*t+0.4)+0.15*S(P2*0.61*t+2.2);
    var fast=(S(P2*9.6*t)+0.6*S(P2*11.1*t+1.7))/1.6;
    var sway=0.025*(0.6*S(P2*0.17*t+0.5)+0.4*S(P2*0.29*t+2.0));
    /* 息 */
    var b=eng.breath||0; this._bs+=(b-this._bs)*Math.min(1,dt/(b>this._bs?0.30:0.08)); var bs=this._bs;
    var wob=bs*0.08*(0.65*S(P2*1.05*t)+0.35*S(P2*1.63*t+1.1));
    /* 触る: 触れた所の方へ炎が引かれ、少し揺れる(なぞった跡も足し合わせる) */
    var asp=eng.canvas.width/Math.max(1,eng.canvas.height), R=eng.rip, px=0, py=0, fl=0;
    for(var i=0;i<32;i++){ var z=R[i*3+2]; if(z<0) continue; var ag=t-z; if(ag<0||ag>9) continue;
      var en=(1-Math.exp(-ag/0.45))*Math.exp(-ag/2.2)/0.577;
      var dx=(R[i*3]-0.5)*asp, dy=R[i*3+1]-0.45;
      px+=en*Math.max(-1,Math.min(1,dx/0.12));
      py+=en*Math.max(-1,Math.min(1,dy/0.25));
      fl+=en*(0.45+0.55*Math.exp(-(dx*dx+dy*dy)/0.04)); }
    var aT=0.55*px/Math.sqrt(1+px*px), sT=0.12*py/Math.sqrt(1+py*py), fT=fl/Math.sqrt(1+fl*fl);
    var flut=fT*0.10*(0.7*S(P2*1.15*t+0.3)+0.3*S(P2*1.9*t+2.0));
    var A=0.60*bs+aT+sway+wob+flut;
    /* なめらかに追う(動き始めをゆっくり)+先端の速さの上限 */
    var k=Math.min(1,dt/0.30); this._a1+=(A-this._a1)*k;
    var da=(this._a1-this._a)*Math.min(1,dt/0.30), vmax=0.34*dt; if(da>vmax) da=vmax; if(da<-vmax) da=-vmax; this._a+=da;
    var len=(1+0.04*slow+0.006*fast)*(1+0.45*bs+sT);
    var wid=(1-0.30*bs)*(1-0.4*Math.abs(aT));
    var fb=(1-0.20*bs)*(1+0.03*slow+0.004*fast)*(1+0.05*bs*S(P2*1.4*t));
    var lit=(1-0.25*bs)*(1+0.05*slow)*(1-0.04*fT); this._lit+=(lit-this._lit)*Math.min(1,dt/0.25);
    return { uFA:this._a, uFS:[len,wid,fb], uLit:this._lit, uBs:bs };
  },
  glsl: "uniform float uFA,uLit,uBs; uniform vec3 uFS;\nconst float HC=9.0; const float RC=2.5; const float RIN=2.12; const float HP=8.45; const float ZW=15.0;\nconst vec3 CAM=vec3(0.0,28.0,-56.0); const vec3 TGT=vec3(0.0,12.5,0.0); const float TH=0.36397;\nconst float FL=3.2; const float FW=0.50; const float FB=-0.15;\nconst vec3 LC=vec3(1.0,0.60,0.28);\nvec2 projS(vec3 P,vec3 f,vec3 u,float asp){ vec3 d=P-CAM; float z=dot(d,f); return vec2(0.5+d.x/z/(2.0*TH*asp),0.5+dot(d,u)/z/(2.0*TH))*uRes; }\nfloat lum3(vec3 c){ return dot(c,vec3(0.30,0.59,0.11)); }\nvec3 tmap(vec3 c,float cap){ return c/(1.0+lum3(c)/cap); }\nvec3 toe(vec3 c){ float l=lum3(c); return c*(l/(l+0.0055)); }\n/* 炎の光がろうそくの縁にさえぎられる割合(炎は縦に長いので影の境はやわらかい) */\nfloat cShadow(vec3 P,vec3 Lp){ float rP=length(P.xz-Lp.xz); if(rP<=RC+0.05) return 0.12;\n float yax=P.y+(HC-P.y)*rP/(rP-RC); return mix(0.12,1.0,clamp((HC+2.4-yax)/2.2,0.0,1.0)); }\nvec3 wallCol(vec3 P,vec3 Lp,float I0){\n vec3 alb=vec3(0.46,0.42,0.37)*(0.9+0.2*fbm(P.xy*0.22));\n vec3 Lv=Lp-P; float d=length(Lv); float E=I0*max(-Lv.z,0.0)/(d*d*d)*cShadow(P,Lp);\n return alb*LC*E*0.32;\n}\nvec3 tableCol(vec3 P,vec3 dir,vec3 Lp,float I0,vec2 uv,float asp,float t){\n float gr=noise(vec2(P.x*0.05+3.0,P.z*0.9))*0.6+noise(vec2(P.x*0.02,P.z*3.1+1.7))*0.4;\n vec3 alb=vec3(0.50,0.30,0.16)*(0.65+0.7*gr);\n vec3 Lv=Lp-P; float d=length(Lv); float sh=cShadow(P,Lp);\n float E=I0*max(Lv.y,0.0)/(d*d*d)*sh;\n vec3 dif=alb*LC*E*0.32;\n vec3 V=-dir; vec3 Hh=normalize(Lv/d+V); float fr=0.04+0.96*pow(1.0-max(dot(V,Hh),0.0),5.0);\n vec3 spc=LC*I0*sh/(d*d)*pow(max(Hh.y,0.0),70.0)*fr*0.9;\n float rP2=length(P.xz); dif+=vec3(1.0,0.5,0.22)*0.0012*exp(-rP2/5.0)*(I0/72.0);\n float shim=0.0;\n for(int i=0;i<32;i++){ vec3 rp=uRip[i]; float ag=t-rp.z; if(rp.z<0.0||ag<0.0||ag>4.0) continue;\n  vec2 dq=(uv-rp.xy)*vec2(asp,1.0); float en=smoothstep(0.0,0.5,ag)*exp(-ag/1.4);\n  shim+=en*exp(-dot(dq,dq)/0.0025)*sin(6.2832*0.8*ag+rp.x*9.0); }\n return (dif+spc)*(1.0+0.6*clamp(shim,-1 /* ほたるの川: 月のない夜の小川と両岸の草むら。光はほたるだけ。

(function(){
var N = 16;

function flash(u){
  if(u<0) return 0;
  if(u<0.6) return 0.5-0.5*Math.cos(Math.PI*u/0.6);

  id:"firefly", name:"ほたるの川", sub:"小川をとぶほたる", free:false, order:6,

  update:function(t,eng){

"  float clump=0.40+1.15*noise(vec2(bx*7.0+seed*3.7,0.5));",
"  float bh=hgt*clump*(0.35+0.9*r2*r2); float rel=(p.y-yb)/bh;",
"  if(rel<-0.3||rel>1.0) continue;",
"  float rr=max(rel,0.0);",
"  float xc=bx+((r3-0.5)*0.9*cw+sway*(0.6+0.8*r1))*rr*rr;",
"  float w=cw*0.22*pow(1.0-rr,0.8)+px*0.3;",
"  float a=1.0-smoothstep(w-px,w+px,abs(p.x-xc));",
"  if(a>m){ m=a; tone=0.3+0.7*r2; }",
" }",
" return vec2(m,tone);",
"}",
"vec3 sceneColor(vec2 frag){",
" vec2 uv=frag/uRes; float asp=uRes.x/uRes.y; float t=uTime; float px=1.0/uRes.y;",
" float x=uv.x, y=uv.y; vec2 P=vec2(x*asp,y);",
" float nE=nearEdge(x)+0.003*(noise(vec2(x*130.0,2.0))-0.5), fE=farEdge(x)+0.003*(noise(vec2(x*140.0,5.0))-0.5), bT=bankTop(x);",
" float H=0.560;",
" vec3 col; float grass=0.0; float alb=0.0; float water=0.0;",
" float sw=uSway*0.032+0.0025*sin(t*0.35+x*3.0);",
" /* 空と林・向こう岸の草・小川・手前の草むら */",
" if(y>bT){ col=forest(x,y,asp,px); }",
" else if(y>fE){ vec2 b=blades(P,asp,1.0,0.0045,0.045,-0.004,0.0,9.0,px); col=vec3(0.0013,0.0013,0.0011)*(0.8+0.4*b.x); grass=0.6; alb=0.20+0.45*noise(P*vec2(150.0,70.0))+0.25*b.x*b.y; }",
" else if(y>nE){ water=1.0; col=vec3(0.0); }",
" else { col=vec3(0.0020,0.0019,0.0016); grass=1.0; alb=0.18+0.12*noise(P*vec2(120.0,30.0)); }",
" /* 手前の草の葉: 奥から手前へ4段。手前ほど太く高い。高さは株ごとにばらつく */",
" if(y<nE+0.22){",
"  vec2 b4=blades(P,asp,0.0,0.009,0.060,0.004,sw*0.4,5.0,px);",
"  vec2 b3=blades(P,asp,0.0,0.014,0.110,0.030,sw*0.6,2.0,px);",
"  vec2 b2=blades(P,asp,0.0,0.021,0.150,0.075,sw*0.85,1.0,px);",
"  vec2 b1=blades(P,asp,0.0,0.030,0.170,0.140,sw,7.0,px);",
"  vec3 bc=vec3(0.0009,0.0009,0.0008);",
"  float a;",
"  a=b4.x; col=mix(col,bc,a); grass=mix(grass,0.8,a); alb=mix(alb,0.30+0.45*b4.y,a); water*=1.0-a;",
"  a=b3.x; col=mix(col,bc,a); grass=mix(grass,0.9,a); alb=mix(alb,0.30+0.55*b3.y,a); water*=1.0-a;",
"  a=b2.x; col=mix(col,bc,a); grass=mix(grass,1.0,a); alb=mix(alb,0.30+0.60*b2.y,a); water*=1.0-a;",
"  a=b1.x; col=mix(col,bc*0.8,a); grass=mix(grass,0.8,a); alb=mix(alb,0.20+0.45*b1.y,a); water*=1.0-a;",
" }",
" vec2 off=vec2(0.0); float rw=0.0; float dep=clamp((y-nE)/max(fE-nE,0.01),0.0,1.0);",
" if(water>0.0){",
"  /* ゆるい流れのさざなみ(右へゆっくり流れる) */",
"  vec2 wq=vec2(P.x*55.0-t*0.18,y*190.0);",
"  off=vec2(noise(wq)-0.5,noise(wq*1.7+vec2(4.0,-t*0.05))-0.5)*vec2(0.0035,0.010)*mix(1.0,0.5,dep);",
"  /* 触った所の波紋: 水面の傾きだけを変え、映り込みが輪の形にゆがむ(下流へゆっくり流される) */",
"  vec2 rv=vec2(0.0);",
"  for(int i=0;i<32;i++){ vec3 r=uRip[i]; float age=t-r.z; if(r.z<0.0||age<0.0||age>6.0) continue;",
"   float rnE=nearEdge(r.x), rfE=farEdge(r.x); if(r.y<=rnE+0.004||r.y>=rfE-0.004) continue;",
"   float nS=clamp((rfE-r.y)/max(rfE-rnE,0.01),0.,1.);",
"   vec2 c=r.xy+vec2(age*0.0045,0.0);",
"   vec2 dq=(uv-c)*vec2(asp,1.0); dq.y/=mix(0.40,0.55,nS);",
"   float sc=mix(0.6,1.0,nS); float dist=length(dq); float front=(0.010+age*0.036)*sc;",
"   float band=exp(-pow((dist-front)/(0.032*sc),2.0))*smoothstep(front+0.016*sc,front,dist);",
"   float fade=exp(-age*0.50)*smoothstep(0.0,0.6,age)*smoothstep(0.0,0.6*front,dist);",
"   float v=band*fade*sin((dist-front)/(0.0045*sc));",
"   rw+=v; rv+=v*dq/max(dist,1e-4);",
"  }",
"  off+=vec2(rv.x*0.008,rw*0.018);",
"  /* 映り込み: 遠くの空と林は目の高さで折り返し、向こう岸の草は岸で折り返す */",
"  float ym=2.0*H-y+off.y; float xm=x+off.x;",
"  vec3 refl=forest(xm,ym,asp,px*1.5);",
"  float yb=2.0*fE-y+off.y*0.5;",
"  refl=mix(refl,vec3(0.0005,0.0005,0.0005),1.0-smoothstep(bankTop(xm)-0.004,bankTop(xm)+0.004,yb));",
"  float fres=mix(0.55,0.95,dep);",
"  col=mix(col,refl*fres+vec3(0.0007,0.0007,0.0007),water);",
" }",
" /* ほたる: 光の点とぼけ・草を照らす光・水面の映り込み */",
" vec3 glow=vec3(0.0); float lit=0.0; float amb=0.0; float wl=0.0; vec3 rf=vec3(0.0);",
" for(int i=0;i<16;i++){ vec3 F=uF[i]; vec3 G=uG[i]; float I=F.z; if(I<0.002) continue;",
"  vec2 d=(uv-F.xy)*vec2(asp,1.0); float dd=length(d); float s=G.x;",
"  float sig=(1.0+0.9*s)*px;",
"  float core=exp(-dd*dd/(2.0*sig*sig));",
"  float halo=exp(-dd/((3.0+3.5*s)*px))*0.22+exp(-dd*dd/(2.0*pow((10.0+10.0*s)*px,2.0)))*0.035;",
"  glow+=FC*I*(core*0.13+halo*0.30);",
"  lit+=I*(exp(-dd*dd/(2.0*pow(0.013*s,2.0)))+0.20*exp(-dd/(0.022*s)));",
"  amb+=I*s*exp(-dd/(0.12*s));",
"  wl+=I*exp(-dd/(0.05*s));",
"  if(water>0.0&&G.z>0.0){",
"   vec2 e=(uv+off*vec2(1.0,0.6)-vec2(F.x,G.y))*vec2(asp,1.0); e.y*=0.42;",
"   float rc=exp(-dot(e,e)/(2.0*pow((1.3+1.1*s)*px,2.0)));",
"   float rh=exp(-length(e)/((4.0+4.0*s)*px))*0.15;",
"   rf+=FC*I*G.z*(rc*0.09+rh*0.35);",
"  }",
" }",
" vec3 grassLit=FC*vec3(0.60,0.80,0.45)*0.030;",
" vec3 ambC=FC*vec3(0.55,0.75,0.45);",
" col+=grassLit*alb*grass*lit+ambC*0.0075*amb*grass*(0.3+alb);",
" col+=(rf*mix(0.55,0.9,dep)+ambC*0.0055*amb*mix(0.6,1.0,dep)+(FC*0.030*wl+vec3(0.0016,0.0015,0.0014))*max(rw,0.0)*mix(0.6,1.0,dep))*water;",
" col+=glow;",
" float vig=smoothstep(1.35,0.35,length((uv-vec2(0.5,0.5))*vec2(asp,1.0)));",
" col*=mix(0.78,1.0,vig);",
" return col;",
"}"].join("\n")
});
})();

</script>
<script>
(function(){
"use strict";
/* 景色ファイルの一覧(ここだけ)。無いファイルは飛ばし、読めた物だけを order の順に使う */
var SCENE_IDS=["sea","rain","ember","snow","candle","firefly"];
var MINUTES=[15,30,45,60];
var FREE_MIN=15, LONG_PRESS=600, CTRL_HIDE=4000, AD_WAIT=5;

var Y=window.Yorumi||{}; Y.scenes=Y.scenes||[];
var Q=new URLSearchParams(location.search);
var $=function(id){ return document.getElementById(id); };

/* 覚えておく値 */
var store={
  get:function(k,d){ try{ var v=localStorage.getItem("yorumi."+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set:function(k,v){ try{ localStorage.setItem("yorumi."+k,JSON.stringify(v)); }catch(e){} },
  clear:function(){ try{ for(var i=localStorage.length-1;i>=0;i--){ var k=localStorage.key(i); if(k&&k.indexOf("yorumi.")===0) localStorage.removeItem(k); } }catch(e){} }
};
if(Q.get("reset")==="1") store.clear();
var S={
  paid: Q.get("paid")==="1" || store.get("paid",false),
  fast: Q.get("fast")==="1" || store.get("fast",false),
  mic: store.get("mic",true),
  introDone: store.get("introDone",false), hintDone: store.get("hintDone",false), swipeDone: store.get("swipeDone",false),
  scene: store.get("scene","sea"), min: store.get("min",FREE_MIN)
};
function save(k){ store.set(k,S[k]); }

/* ===== 景色の読み込み ===== */
function loadScenes(done){
  var have={}, left=0, fin=false;
  Y.scenes.forEach(function(s){ if(s&&s.id) have[s.id]=1; });
  function end(){ if(fin) return; fin=true; done(); }
  function one(){ if(--left<=0) end(); }
  SCENE_IDS.forEach(function(id){
    if(have[id]) return; left++;
    var el=document.createElement("script"); el.src="scenes/"+id+".js"; el.async=false;
    el.onload=one; el.onerror=one; document.head.appendChild(el);
  });
  if(left===0) end();
  setTimeout(end,5000);
}
var list=[], bad={};
function order(s){ return typeof s.order==="number"? s.order : 100+SCENE_IDS.indexOf(s.id); }
function buildList(){
  var seen={};
  list=Y.scenes.filter(function(s){
    if(!s||!s.id||typeof s.glsl!=="string"||seen[s.id]||bad[s.id]) return false;
    seen[s.id]=1; return true;
  }).sort(function(a,b){ return order(a)-order(b); });
}

/* ===== 描く ===== */
var canvas=$("scene"), eng=null, raf=0, last=0, clock=0;
var fade={from:1,to:1,t0:0,dur:0}, screenDim=1;
function fadeVal(now){ if(!fade.dur) return fade.to; var p=Math.min(1,(now-fade.t0)/fade.dur); p=p*p*(3-2*p); return fade.from+(fade.to-fade.from)*p; }
function fadeTo(v,ms){ var now=performance.now(); fade={from:fadeVal(now),to:v,t0:now,dur:ms}; }
function cur(){ return list[idx]||null; }
/* ずらす量(画面の高さに対する割合)。主役が下にある景色を上へ。月夜の海は月が上端で切れるので動かさない */
var LIFT={sea:0}, LIFT_DEFAULT=0.18;
function setLift(s){
  var v= s&&LIFT[s.id]!=null? LIFT[s.id] : LIFT_DEFAULT;
  canvas.style.transition="opacity .35s"; document.body.style.setProperty("--lift",(-v*100)+"%"); canvas.offsetWidth; canvas.style.transition="";
}
function trySet(s){
  setLift(s);
  if(!eng||!eng.gl) return true;
  try{ eng.setScene(s.id); eng.prog(s); return true; }catch(e){ bad[s.id]=1; return false; }
}
function frame(now){
  raf=requestAnimationFrame(frame);
  var real=last? Math.min(1,(now-last)/1000) : 0, dt=Math.min(0.05,real); last=now; clock+=dt;
  if(mode==="view") viewTick(real);
  if(!raf) return;
  eng.breath=Y.Breath.step(dt);
  eng.dim=fadeVal(now)*screenDim;
  try{ eng.draw(clock); }catch(e){ var s=cur(); if(s){ bad[s.id]=1; } buildList(); if(idx>=list.length) idx=0; if(cur()) trySet(cur()); renderHome(); }
}
function startLoop(){ if(!raf&&eng&&eng.gl){ last=0; raf=requestAnimationFrame(frame); } }
function stopLoop(){ if(raf) cancelAnimationFrame(raf); raf=0; }

/* ===== 画面 ===== */
var mode=null, overlays=[];
var SCREENS=["intro","mic","home","ad","view","end"];
function go(name){
  SCREENS.forEach(function(n){ $("s-"+n).classList.toggle("on",n===name); });
  mode=name;
  document.body.classList.toggle("black",name==="end");
  document.body.classList.toggle("lift",name==="intro"||name==="mic"||name==="home");
  screenDim = 1;
  if(name==="intro"||name==="mic"){ var sea=list.filter(function(x){ return x.id==="sea"; })[0]; if(sea) trySet(sea); }
  if(name==="ad"||name==="end") stopLoop(); else if(!overlays.length) startLoop();
}
var pauseTimer=0;
function openSheet(name){
  if(overlays.indexOf(name)<0) overlays.push(name);
  $("s-"+name).classList.add("on");
  clearTimeout(pauseTimer); pauseTimer=setTimeout(function(){ if(overlays.length) stopLoop(); },400);
}
function closeSheet(name){
  overlays=overlays.filter(function(n){ return n!==name; });
  $("s-"+name).classList.remove("on");
  if(!overlays.length){ clearTimeout(pauseTimer); if(mode!=="ad"&&mode!=="end") startLoop(); }
}

/* ===== 触る(波紋) ===== */
var lastRip=-9;
function ripple(e,force){
  if(!eng) return;
  if(!force&&eng.time-lastRip<0.08) return; lastRip=eng.time;
  var r=canvas.getBoundingClientRect(); eng.addRipple((e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height);
}
function isUI(e){ return e.target.closest&&e.target.closest("button,.ctrl.on"); }

/* ===== 紹介・マイク ===== */
$("b-start").onclick=function(){ go("mic"); };
$("b-mic").onclick=function(){
  var b=this; b.disabled=true;
  var p=Y.Breath.start? Y.Breath.start() : Promise.resolve(false);
  var next=function(ok){ b.disabled=false; S.introDone=true; save("introDone"); if(ok===false&&Y.Breath.status==="使えない"){ /* 断られても使える */ } toHome(); };
  p.then(next,next);
};
["s-intro","s-mic"].forEach(function(id){
  var el=$(id), down=false;
  el.addEventListener("pointerdown",function(e){ if(isUI(e)) return; down=true; ripple(e,true); });
  el.addEventListener("pointermove",function(e){ if(down) ripple(e); });
});

/* ===== 景色を選ぶ ===== */
var idx=0, switching=false;
function effMin(){ return S.paid? S.min : FREE_MIN; }
function locked(s){ return s&&s.free===false&&!S.paid; }
function pad2(n){ return (n<10?"0":"")+n; }
function renderHome(){
  var s=cur();
  var dots=$("h-dots"); dots.innerHTML="";
  list.forEach(function(x,i){ var d=document.createElement("i"); d.className=(i===idx?"cur ":"")+(locked(x)?"paid":""); dots.appendChild(d); });
  $("h-swipe").hidden= S.swipeDone || list.length<2;
  $("h-name").textContent= s? (s.name||s.id) : "";
  $("h-sub").textContent= s&&s.sub? s.sub : "";
  $("h-lock").hidden=!locked(s);
  $("h-thead").classList.toggle("hide",S.paid);
  $("b-go-l").textContent= locked(s)? "有料プランで眺める" : "眺める";
  $("b-go-r").textContent= effMin()+"分";
  var box=$("h-times"); box.innerHTML="";
  MINUTES.forEach(function(m){
    var b=document.createElement("button");
    b.innerHTML='<span class="t"><span class="num">'+m+'</span><small>分</small></span>';
    if(m===effMin()) b.className="sel"; else if(!S.paid&&m!==FREE_MIN) b.className="lock";
    b.onclick=function(){
      if(!S.paid&&m!==FREE_MIN){ openPaywall({min:m}); return; }
      S.min=m; save("min"); renderHome();
    };
    box.appendChild(b);
  });
  /* 両端そろえ: 「15分」の左と「60分」の右を、線とボタンの端に合わせる */
  box.style.margin=""; var f=box.firstChild; if(f&&f.offsetWidth){ var off=f.firstChild.getBoundingClientRect().left-f.getBoundingClientRect().left; box.style.margin="0 "+(-off)+"px"; }
}
var info=$("h-info");
function infoStyle(x,op,ms){ info.style.transition= ms? "transform "+ms+"ms ease,opacity "+ms+"ms ease" : "none"; info.style.transform= x? "translateX("+x+"px)" : ""; info.style.opacity= op==null? "" : String(op); }
function swipeSeen(){ if(S.swipeDone) return; S.swipeDone=true; save("swipeDone"); $("h-swipe").classList.add("gone"); setTimeout(function(){ $("h-swipe").hidden=true; },400); }
function switchBy(d){
  if(switching||list.length<2) return;
  switching=true;
  var next=(idx+d+list.length)%list.length;
  fadeTo(0,750); infoStyle(-d*24,0,750);
  setTimeout(function(){
    var n=list.length, tries=0;
    while(tries<n && !trySet(list[next])){ buildList(); next=next%Math.max(1,list.length); tries++; }
    idx=next; S.scene=cur()?cur().id:S.scene; save("scene"); renderHome();
    infoStyle(d*24,0,0); info.offsetWidth;
    fadeTo(1,750); infoStyle(0,null,750);
    setTimeout(function(){ switching=false; },750);
  },760);
}
(function(){
  var el=$("s-home"), down=false, sx=0, sy=0, swipe=false;
  el.addEventListener("pointerdown",function(e){ if(isUI(e)) return; down=true; swipe=false; sx=e.clientX; sy=e.clientY; ripple(e,true); });
  el.addEventListener("pointermove",function(e){
    if(!down) return; var dx=e.clientX-sx, dy=e.clientY-sy;
    if(!swipe&&!switching&&list.length>1&&Math.abs(dx)>14&&Math.abs(dx)>Math.abs(dy)*1.2) swipe=true;
    if(!swipe){ ripple(e); return; }
    var x=dx*0.3; infoStyle(x,1-0.6*Math.min(1,Math.abs(x)/48),0);
  });
  function up(e){
    if(!down) return; down=false;
    var dx=e.clientX-sx;
    if(swipe&&Math.abs(dx)>48){ swipeSeen(); switchBy(dx<0?1:-1); }
    else if(swipe) infoStyle(0,null,350);
    swipe=false;
  }
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",function(){ down=false; if(swipe) infoStyle(0,null,350); swipe=false; });
  addEventListener("keydown",function(e){ if(mode==="home"&&!overlays.length){ if(e.key==="ArrowRight") switchBy(1); if(e.key==="ArrowLeft") switchBy(-1); } });
})();
function toHome(){ go("home"); if(cur()) trySet(cur()); renderHome(); fadeTo(1,1500); }
$("b-settings").onclick=function(){ renderSettings(); openSheet("settings"); };
$("b-go").onclick=function(){
  var s=cur(); if(!s) return;
  if(locked(s)){ openPaywall({scene:s.id}); return; }
  if(S.paid) startView(); else showAd();
};

/* ===== 広告(仮) ===== */
var adTimer=0;
function showAd(){
  go("ad");
  var n=AD_WAIT, slot=$("ad-close-slot");
  slot.innerHTML='<span class="count num" id="ad-count"></span>';
  function tick(){
    if(n>0){ $("ad-count").textContent="あと"+n+"秒"; n--; adTimer=setTimeout(tick,1000); return; }
    slot.innerHTML='<button class="tbtn" id="b-ad-close" style="color:var(--tx);font-size:17px;margin-right:-12px;padding:0 12px">閉じる</button>';
    $("b-ad-close").onclick=function(){ startView(); };
  }
  clearTimeout(adTimer); tick();
}

/* ===== 眺める ===== */
var V={el:0,total:0,k:1}, hintTimer=[], ctrlTimer=0, lpTimer=0, wl=null;
function lockOn(){ try{ if(navigator.wakeLock) navigator.wakeLock.request("screen").then(function(l){ wl=l; },function(){}); }catch(e){} }
function lockOff(){ try{ if(wl) wl.release(); }catch(e){} wl=null; }
document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible"&&mode==="view") lockOn(); });
function startView(){
  clearTimeout(adTimer);
  if(S.mic&&!Y.Breath.on&&Y.Breath.start) Y.Breath.start();   /* マイクは広告が閉じてから */
  V.k=S.fast? 1/15 : 1; V.total=effMin()*60*V.k; V.el=0;
  hideCtrl(true); fade={from:1,to:1,t0:0,dur:0};
  go("view"); lockOn();
  hintTimer.forEach(clearTimeout); $("v-hint").classList.remove("on");
  if(!S.hintDone){
    S.hintDone=true; save("hintDone");
    hintTimer=[setTimeout(function(){ $("v-hint").classList.add("on"); },1200), setTimeout(function(){ $("v-hint").classList.remove("on"); },6500)];
  }
}
function viewTick(dt){
  V.el+=dt;
  screenDim=Y.dimAt(V.el/V.k, V.total/V.k);
  if($("v-ctrl").classList.contains("on")) showRest();
  if(V.el>=V.total) toEnd();
}
function showRest(){ var r=Math.max(0,Math.ceil(V.total-V.el)); $("v-rest").textContent=Math.floor(r/60)+":"+pad2(r%60); }
function showCtrl(){ showRest(); $("v-ctrl").classList.add("on"); clearTimeout(ctrlTimer); ctrlTimer=setTimeout(function(){ hideCtrl(); },CTRL_HIDE); }
function hideCtrl(now){ clearTimeout(ctrlTimer); var c=$("v-ctrl"); if(now){ c.style.transition="none"; c.classList.remove("on"); c.offsetWidth; c.style.transition=""; } else c.classList.remove("on"); }
function toEnd(){ screenDim=0; eng.dim=0; try{ eng.draw(clock); }catch(e){} hideCtrl(true); hintTimer.forEach(clearTimeout); $("v-hint").classList.remove("on"); go("end"); lockOff(); }
$("b-end").onclick=function(){ hideCtrl(true); lockOff(); fade={from:0,to:0,t0:0,dur:0}; go("home"); renderHome(); fadeTo(1,2500); };
(function(){
  var el=$("s-view"), down=false, sx=0, sy=0;
  el.addEventListener("pointerdown",function(e){
    if(isUI(e)){ clearTimeout(ctrlTimer); ctrlTimer=setTimeout(function(){ hideCtrl(); },CTRL_HIDE); return; }
    down=true; sx=e.clientX; sy=e.clientY; ripple(e,true);
    clearTimeout(lpTimer); lpTimer=setTimeout(function(){ if(down) showCtrl(); },LONG_PRESS);
  });
  el.addEventListener("pointermove",function(e){
    if(!down) return; ripple(e);
    if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>12) clearTimeout(lpTimer);
  });
  function up(){ down=false; clearTimeout(lpTimer); }
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
  $("s-end").addEventListener("pointerdown",function(e){
    V.el=Math.max(0,V.total-180*V.k); screenDim=Y.dimAt(V.el/V.k,V.total/V.k);
    go("view"); lockOn(); ripple(e,true);
  });
})();
document.addEventListener("contextmenu",function(e){ e.preventDefault(); });

/* ===== 設定 ===== */
function onoff(id,v){ $(id).classList.toggle("on",!!v); $(id).parentNode.setAttribute("aria-checked",v?"true":"false"); }
function renderSettings(){
  $("r-plan-v").textContent=S.paid?"加入中":"未加入";
  onoff("r-mic-v",S.mic); onoff("r-paid-v",S.paid); onoff("r-fast-v",S.fast);
}
$("b-set-close").onclick=function(){ closeSheet("settings"); renderHome(); };
$("r-plan").onclick=function(){ openPaywall({}); };
$("r-mic").onclick=function(){ S.mic=!S.mic; save("mic"); if(S.mic){ if(!Y.Breath.on&&Y.Breath.start) Y.Breath.start(); } else if(Y.Breath.stop) Y.Breath.stop(); renderSettings(); };
$("r-paid").onclick=function(){ S.paid=!S.paid; save("paid"); renderSettings(); renderHome(); };
$("r-fast").onclick=function(){ S.fast=!S.fast; save("fast"); renderSettings(); };
$("r-again").onclick=function(){
  S.introDone=false; S.hintDone=false; save("introDone"); save("hintDone");
  closeSheet("settings"); go("intro"); fadeTo(1,1500);
};

/* ===== 有料の案内 ===== */
var pwIntent={}, plan="year";
function openPaywall(intent){
  pwIntent=intent||{};
  var box=$("pw-thumbs"), T=window.YORUMI_THUMBS||{}; box.innerHTML="";
  SCENE_IDS.forEach(function(id){
    var sc=Y.scenes.filter(function(x){ return x&&x.id===id; })[0];
    var f=document.createElement("figure"), ph=document.createElement("div"), cap=document.createElement("figcaption");
    ph.className="ph"; if(T[id]) ph.style.backgroundImage='url("'+T[id]+'")';
    cap.textContent= sc&&sc.name? sc.name : "";
    f.appendChild(ph); f.appendChild(cap); box.appendChild(f);
  });
  $("pw-count").textContent=SCENE_IDS.length+"つすべて";
  var b=$("b-buy"); b.disabled=S.paid; b.textContent=S.paid?"加入しています":"登録する";
  openSheet("paywall");
}
Array.prototype.forEach.call(document.querySelectorAll(".plan"),function(p){
  p.onclick=function(){ plan=p.getAttribute("data-plan"); Array.prototype.forEach.call(document.querySelectorAll(".plan"),function(q){ q.classList.toggle("sel",q===p); }); };
});
$("b-pw-close").onclick=function(){ closeSheet("paywall"); };
$("b-buy").onclick=function(){
  S.paid=true; save("paid");
  if(pwIntent.min){ S.min=pwIntent.min; save("min"); }
  closeSheet("paywall"); renderSettings(); renderHome();
};

/* ===== 始める ===== */
function init(){
  if(Y.Engine){ eng=new Y.Engine(canvas, Q.get("scale")? {scale:+Q.get("scale")} : {}); }
  if(!eng||!eng.gl){
    canvas.style.display="none";
    var T=window.YORUMI_THUMBS||{}; if(T[S.scene]) $("backdrop").style.backgroundImage='url("'+T[S.scene]+'")';
  }
  buildList();
  if(eng&&eng.gl) list.forEach(function(s){ try{ eng.prog(s); }catch(e){ bad[s.id]=1; } });
  buildList();
  idx=0; list.forEach(function(s,i){ if(s.id===S.scene) idx=i; });
  if(cur()) trySet(cur());
  if(list.length&&cur().id!==S.scene){ S.scene=cur().id; }
  renderHome(); renderSettings();
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ renderHome(); });

  var want=Q.get("screen");
  var first= S.introDone? "home" : "intro";
  if(want==="intro"||want==="mic"||want==="home"||want==="end") first=want;
  if(want==="ad"){ go("home"); showAd(); }
  else if(want==="view"){ go("home"); startView(); }
  else if(want==="settings"){ go("home"); renderSettings(); openSheet("settings"); }
  else if(want==="paywall"){ go("home"); openPaywall({}); }
  else go(first);
  if(mode==="end"){ V.k=S.fast?1/15:1; V.total=effMin()*60*V.k; V.el=V.total; }
  window.YorumiApp={ready:true, state:S, list:function(){ return list.map(function(s){ return s.id; }); }, go:go, openPaywall:openPaywall, switchBy:switchBy, showCtrl:showCtrl, render:renderHome, freeze:function(){ stopLoop(); return clock; }};
}
loadScenes(init);
})();
</script>
</body>
