<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>Yorumi 見比べ</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
  #dbg{position:fixed;left:8px;top:8px;color:#9cf;font:12px/1.4 monospace;white-space:pre;pointer-events:none;z-index:9}
  #start{position:fixed;left:0;right:0;bottom:16vh;text-align:center;color:rgba(255,214,170,.55);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Noto Sans JP",sans-serif;
    font-size:15px;letter-spacing:.12em;transition:opacity 2.5s ease;pointer-events:none}
  #ui{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));z-index:8;display:flex;flex-direction:column;gap:10px;align-items:center;opacity:.45;transition:opacity 1s;
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Noto Sans JP",sans-serif}
  #ui .row{display:flex;gap:8px;align-items:center;padding-right:56px}
  #ui .lb{color:rgba(255,214,170,.7);font-size:14px;width:44px;text-align:right;margin-right:4px}
  #ui button{min-width:72px;height:46px;border-radius:23px;border:1px solid rgba(255,214,170,.35);background:rgba(0,0,0,.5);color:rgba(255,214,170,.75);font:15px inherit;font-family:inherit}
  #ui button.on{background:rgba(255,214,170,.22);color:rgba(255,230,200,.95);border-color:rgba(255,214,170,.7)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="start" lang="ja">画面に触れてはじめる</div>
<div id="dbg"></div>
<div id="ui" lang="ja">
  <div class="row"><span class="lb">息</span><button data-k="lv" data-v="1">弱</button><button data-k="lv" data-v="2" class="on">中</button><button data-k="lv" data-v="3">強</button></div>
</div>
<script>
(function(){
  "use strict";
  var P = new URLSearchParams(location.search); window.PICK={lv:parseFloat(P.get("lv")||"2"),bs:0.4,bra:parseFloat(P.get("bra")||"0"),ts:parseFloat(P.get("ts")||"0.0193"),life:parseFloat(P.get("life")||"3"),sig:parseFloat(P.get("sig")||"0.004"),spk:parseFloat(P.get("spk")||"1"),exp:parseFloat(P.get("exp")||"0.6"),wa:parseFloat(P.get("wa")||"0")};
  var SESSION = parseFloat(P.get("min") || "15") * 60;
  var CAPTURE = P.get("capture") === "1";   // 確認用:時刻を進めて1コマずつ描く
  var TEST    = P.get("test") === "1";      // 確認用:触れずにマイクを始める

  // ===== 息を拾う =====
  var Sensor = {
    on:false, level:0, floor:0, peak:0, env:0, snr:1, hist:[], acc:0, period:0, conf:0, sinceEst:0, status:"未開始",
    start:function(){                // 画面に触れた瞬間に呼ぶ(iPhoneは触れた瞬間でないと音の処理を始められない)
      var self=this;
      var AC=window.AudioContext||window.webkitAudioContext;
      if(!AC||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ self.status="非対応"; return Promise.resolve(false); }
      var ctx=new AC(); self.ctx=ctx; if(ctx.resume) ctx.resume();
      self.status="許可待ち";
      return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(function(stream){
        self.stream=stream;
        var src=ctx.createMediaStreamSource(stream);
        var hp=ctx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=150;
        var lp=ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=3000;
        var an=ctx.createAnalyser(); an.fftSize=1024;
        src.connect(hp); hp.connect(lp); lp.connect(an);
        self.an=an; self.buf=new Float32Array(an.fftSize); self.on=true; self.status="使用中";
        if(ctx.state!=="running") ctx.resume();
        return true;
      }).catch(function(err){ self.status="使えない("+(err&&err.name||"")+")"; return false; });
    },
    rms:function(){ this.an.getFloatTimeDomainData(this.buf); var s=0,b=this.buf; for(var i=0;i<b.length;i++) s+=b[i]*b[i]; return Math.sqrt(s/b.length); },
    feed:function(r, dt){            // r: いまの音の強さ(実機ではマイク、確認時は疑似の息)
      if(this.floor===0){ this.floor=r; this.peak=r*2+1e-6; this.level=r; }
      this.level += (r-this.level)*Math.min(1,dt/0.12);
      var L=this.level;
      if(L<this.floor) this.floor=L; else this.floor += (L-this.floor)*Math.min(1,dt/25);
      if(L>this.peak) this.peak=L; else this.peak += (L-this.peak)*Math.min(1,dt/12);
      if(this.peak<this.floor*1.6) this.peak=this.floor*1.6;
      var e=(L-this.floor)/(this.peak-this.floor); this.env=Math.max(0,Math.min(1,e));
      this.snr=this.peak/Math.max(this.floor,1e-7);   // 息の音が部屋の静けさの何倍あるか
      this.acc+=dt; while(this.acc>=0.1){ this.acc-=0.1; this.hist.push(this.env); if(this.hist.length>400) this.hist.shift(); }
      this.sinceEst+=dt; if(this.sinceEst>=1){ this.sinceEst=0; this.estimate(); }
    },
    estimate:function(){             // 波の繰り返しから、呼吸1回の長さを推定
      var h=this.hist, n=h.length; if(n<150){ this.conf=0; return; }
      var m=0,i; for(i=0;i<n;i++) m+=h[i]; m/=n;
      var v=0; for(i=0;i<n;i++) v+=(h[i]-m)*(h[i]-m); if(v<1e-6){ this.conf=0; return; }
      var best=0,r=[];
      for(var lag=20;lag<=125;lag++){ var c=0; for(i=lag;i<n;i++) c+=(h[i]-m)*(h[i-lag]-m); c/=(v*(n-lag)/n); r[lag]=c; if(lag<=120&&c>best) best=c; }
      // いちばん短い「はっきりした山」を選ぶ(2回分・3回分の長さを1回と取り違えないため)
      var pick=0;
      for(var L=25;L<=120;L++){ if(r[L]>=r[L-1]&&r[L]>=r[L+1]&&r[L]>=0.85*best){ pick=L; break; } }
      if(!pick){ this.conf=0; return; }
      this.conf=r[pick]; this.period=pick/10;
    },
    update:function(dt){ if(this.on) this.feed(this.rms(),dt); }
  };

  // ===== 見本の呼吸:寄り添ってから、少しずつ導く =====
  var IN=0.4;                                  // 吸う4割・吐く6割
  var Pacer = {
    t:0, phase:0, period:60/11, mode:"guide", micUsed:false, user:0,
    begin:function(mic){ this.micUsed=mic; this.mode = mic ? "follow" : "guide"; this.period = mic ? 60/12 : 60/11; },
    step:function(dt, uPeriod, uConf){
      this.t+=dt;
      var sure = this.micUsed && uConf>0.35 && uPeriod>0;
      if(this.mode==="follow"){
        if(sure){ var tgt=Math.max(3.5,Math.min(10,uPeriod)); this.period += (tgt-this.period)*Math.min(1,dt/4); }
        if(this.t>75) this.mode="guide";
      } else {
        // 見本はあなたより最大1.5回/分だけ先を行く。ついて来ていれば、さらにゆっくりへ。来ていなければ待つ
        var bpm=60/this.period, ub = sure ? 60/uPeriod : bpm;
        if(!sure || ub - bpm < 1.5){ bpm = Math.max(6, bpm - 0.6/60*dt); }
        else if(ub - bpm > 2.5){ bpm += Math.min(0.5/60*dt, ub - bpm - 2.5); }  // 離れすぎたら少し戻って迎えに行く
        this.period=60/bpm;
      }
      this.phase += dt/this.period;
    },
    value:function(){ var f=this.phase%1; if(f<IN){ var a=f/IN; return 0.5-0.5*Math.cos(Math.PI*a);} var b=(f-IN)/(1-IN); return 0.5+0.5*Math.cos(Math.PI*b); }
  };

  function dimValue(t){ var hold=180; if(t<=hold) return 1; var x=Math.min(1,(t-hold)/(SESSION-hold)); return Math.pow(1-x,1.6); }
  function calmValue(t){ return Math.min(1, t/420); }

  var canvas=document.getElementById("c");
  var gl=canvas.getContext("webgl",{antialias:false,alpha:false,preserveDrawingBuffer:CAPTURE,powerPreference:"low-power"});
  if(!gl) return;
  var VS="attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";
  var FS = [
  "precision highp float;",
  "uniform vec2 uRes; uniform float uTime, uBreath, uDim, uCalm, uTouch, uUser;",
  "uniform float uTex, uStar, uCloud, uMist, uSpark, uPop, uDetail, uGustAmp;",
  "uniform float uK,uSp,uGW,uTW,uMot; uniform float uG0,uG1,uG2,uG3,uG4,uG5; uniform float uSwell,uSK,uSV,uST,uExA,uTe,uBS,uBA,uBrE,uBrA,uTS,uLife,uSig,uSpk,uExp,uWA; uniform vec3 uRip[32];",
  "const mat2 R0=mat2(.8,-.6,.6,.8);",
  "float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}",
  "vec2 hash2(vec2 p){return vec2(hash(p),hash(p+17.17));}",
  "float noise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);",
  " return mix(mix(hash(i),hash(i+vec2(1,0)),u.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x),u.y);}",
  "float fbm(vec2 p){float v=0.,a=.5;mat2 r=mat2(.8,-.6,.6,.8);for(int i=0;i<5;i++){v+=a*noise(p);p=r*p*2.03;a*=.5;}return v;}",
  "float fbm7(vec2 p,float det){float v=0.,a=.5;mat2 r=mat2(.8,-.6,.6,.8);for(int i=0;i<7;i++){float w=i>=4?det:1.0;v+=a*w*(noise(p)-0.5);p=r*p*2.07;a*=.52;}return v+0.5;}",
  // 水面の高さ:奥から寄せる大きなうねり+大小のさざ波(遠くで見分けられない細かさは消す)
  "float waveH(vec2 W,float t0,float fx,float fz,float calm,float g){",
  " float t=t0*uBS;",
  " float h=uBA*0.06*mix(1.0,0.7,calm)*sin(W.y*3.0+t*0.50+1.6*noise(W*vec2(0.5,0.8)));",
  " float a=0.20,f=7.0; mat2 R=mat2(.8,-.6,.6,.8); vec2 p=W*vec2(0.65,1.0);",
  " for(int i=0;i<6;i++){",
  "  float fi=float(i);",
  "  float fade=smoothstep(0.9,0.25,f*max(fx,fz*0.12));",
  "  float lv=i>=3?uDetail:1.0;",
  "  h+=uBA*a*fade*lv*(noise(p*f+vec2(t*0.22*(1.0+fi*0.35),-t*0.30*(1.0+fi*0.2)))*2.0-1.0);",
  "  p=R*p; f*=1.95; a*=0.55;",
  " }",
  // 息の風:手前から奥へ吹き抜ける細かいさざ波(風の当たる所はまだらになる)
  " if(g>0.001){",
  "  float patch=smoothstep(0.25,0.75,noise(W*vec2(1.6,0.9)+vec2(0.0,-t0*0.35)));",
  "  float nr=clamp((0.16/max(W.y,0.17)-0.01)/0.56,0.,1.);",
  "  float gf=11.0*(1.0+2.5*nr); float ga=0.30*g*(0.25+0.75*patch)/(1.0+1.5*nr);",
  "  float fd=smoothstep(0.9,0.25,gf*max(fx,fz*0.12)); float fd2=smoothstep(0.9,0.25,gf*1.9*max(fx,fz*0.12));",
  "  h+=ga*fd*(noise(W*vec2(gf*0.8,gf)+vec2(0.0,-t0*2.2))*2.0-1.0);",
  "  h+=ga*0.6*fd2*(noise(R0*W*gf*1.9+vec2(0.0,-t0*3.0))*2.0-1.0);",
  " }",
  " return h;",
  "}",
  "float swellPos(){ float sp=max(uExA,0.0)/uTe; float pe=sp<1.0? sp*sp*(3.0-2.0*sp) : 1.0+(sp-1.0); return -log(1.0-0.95*clamp(pe,0.0,1.0))+max(pe-1.0,0.0)*3.0; }",
  "float swellD(float near){ return -log(1.0-0.95*(1.0-near)) - swellPos(); }",
  "float swellFade(){ float sp=uExA/uTe; return step(0.0,uExA)*smoothstep(1.45,1.0,sp)*smoothstep(0.0,0.15,sp); }",
  "float gustAt(float near){",
  " if(uTe>0.0){ float d=swellD(near); return exp(-d*d/0.30)*swellFade()*uGustAmp; }",   // 画面の手前(near=1)ほど早く、奥ほど遅れて風が届く
  " float d=(1.0-near)*5.0;",
  " float i0=floor(d); float f=d-i0;",
  " float a= i0<0.5?uG0: i0<1.5?uG1: i0<2.5?uG2: i0<3.5?uG3: i0<4.5?uG4:uG5;",
  " float b= i0<0.5?uG1: i0<1.5?uG2: i0<2.5?uG3: i0<3.5?uG4:uG5;",
  " return mix(a,b,f)*uGustAmp;",
  "}",
  "float slopeN(float fx,float fz){float s=0.06*3.0,a=0.20,f=7.0;for(int i=0;i<6;i++){float lv=i>=3?uDetail:1.0;s+=a*f*lv*smoothstep(0.9,0.25,f*max(fx,fz*0.12));f*=1.95;a*=0.55;}return s;}",
  // ===== 本物の海の作り(水面の傾きの統計で光の道を出し、その中に細かい光の点を重ねる) =====
  "const float CK=1.155; const float CH=3.0;",
  // うねり8本: 波長(m)・向き(ラジアン)・高さ(m)。深い海の速さ ω=√(g k) で動く
  "vec3 waveSum(vec2 P,float t,float fp,out float lostVar){",
  " float L[8]; L[0]=60.0;L[1]=34.0;L[2]=21.0;L[3]=13.0;L[4]=8.5;L[5]=5.5;L[6]=3.6;L[7]=2.4;",
  " float A[8]; A[0]=0.30;A[1]=-0.35;A[2]=0.70;A[3]=-0.80;A[4]=0.45;A[5]=-0.20;A[6]=1.00;A[7]=-0.65;",
  " float h=0.0; vec2 sl=vec2(0.0); lostVar=0.0;",
  " for(int i=0;i<8;i++){",
  "  float k=6.2832/L[i]; float w=sqrt(9.81*k); float ak=0.034;",
  "  vec2 dir=vec2(sin(A[i]),-cos(A[i]));",
  "  float ph=dot(dir,P)*k - w*t + float(i)*1.7;",
  "  float vis=smoothstep(4.0,9.0,L[i]/fp);",          // 1画素より細かい波は描かず、その分を細かい傾きに回す
  "  h+=vis*(ak/k)*sin(ph); sl+=vis*ak*cos(ph)*dir;",
  "  lostVar+=(1.0-vis)*ak*ak*0.5;",
  " }",
  " return vec3(h,sl);",
  "}",
  "float fresnelW(float c){ c=clamp(c,0.0,1.0); return 0.02+0.98*pow(1.0-c,5.0); }",
  // 光の点: 水面上の小さなマスごとに、細かい傾きを1つずつ持たせる。uLife 秒かけて入れ替わる
  "float glitCell(vec2 cell,float slot,vec2 sreq,float sig,float dlt){",
  " vec2 r1=hash2(cell+slot*17.31); vec2 r2=hash2(cell*1.37+slot*9.71+3.3);",
  " vec2 g=sqrt(-2.0*log(max(r1,1e-4)))*vec2(cos(6.2832*r2.x),sin(6.2832*r2.y));",   // 正規分布の傾き
  " vec2 dd=g*sig-sreq; return exp(-dot(dd,dd)/(2.0*dlt*dlt));",
  "}",
  // 追加の光の点:マスごとに出るきっかけ(しきい値)をずらし、少しずつ数が増える
"float glitLayer(vec2 P,float l0,float lf,float t,float life,float seed,float csc,vec2 sreq,float sig,float dlt,float gate,float kf){",
" float tl=t/life+seed; float s0=floor(tl); float fr=tl-s0; fr=fr*fr*(3.0-2.0*fr); float g=0.0;",
" for(int q=0;q<2;q++){",
"  float cs=0.01*exp2(l0+float(q))*csc; vec2 cp2=P/cs+float(q)*31.7+seed*13.1; vec2 ci=floor(cp2); vec2 cf=fract(cp2)-0.5;",
"  float th=hash(ci+91.7)*0.4; float w=clamp((gate-th)/0.6,0.0,1.0); w=w*w*(3.0-2.0*w); w=w*w*w*step(hash(ci+33.3),kf);",
"  if(w<=0.0) continue;",
"  vec2 jit=hash2(ci+7.7)-0.5; vec2 off=cf-jit*0.5;",
"  float shape=exp(-dot(off,off)/(2.0*0.08*0.08))/(2.0*3.1416*0.08*0.08);",
"  float g1=mix(glitCell(ci,s0,sreq,sig,dlt),glitCell(ci,s0+1.0,sreq,sig,dlt),fr)*shape;",
"  g+=w*g1*(q==0?1.0-lf:lf);",
" }",
" return g;",
"}",
"void main(){",
  " vec2 frag=gl_FragCoord.xy; vec2 uv=frag/uRes; float asp=uRes.x/uRes.y;",
  " float t=uTime; float hz=0.56;",
  " vec2 moonPos=vec2(0.5,0.80);",
  " vec2 q=vec2((uv.x-moonPos.x)*asp,uv.y-moonPos.y);",
  " float br=uBreath; float tc=uTouch;",
  " vec3 moonCol=vec3(1.0,0.64,0.32);",
  " vec3 col;",
  " if(uv.y>hz){",
  "  float h=(uv.y-hz)/(1.-hz);",
  "  col=mix(vec3(0.0060,0.0034,0.0030),vec3(0.0009,0.0008,0.0013),pow(h,0.6));",
  "  float d=length(q);",
  "  vec2 sp=vec2(uv.x*asp,uv.y)*uRes.y/7.0; vec2 si=floor(sp); vec2 sf=fract(sp)-0.5;",
  "  vec2 so=(hash2(si)-0.5)*0.6; float sh=hash(si+3.1);",
  "  float on=step(1.0-0.10*uStar,sh);",
  "  float tw=0.6+0.4*sin(t*(0.3+hash(si+9.)*0.5)+sh*40.);",
  "  float star=on*exp(-dot(sf-so,sf-so)*22.0)*tw*(0.25+0.75*hash(si+5.));",
  "  star*=smoothstep(0.05,0.35,h)*smoothstep(0.10,0.30,d);",
  "  col+=vec3(1.0,0.86,0.72)*star*0.16;",
  "  float r=0.036;",
  "  float disc=smoothstep(r,r-0.003,d);",
  "  float maria=fbm(q*38.0+3.0); float tex=0.70+0.30*smoothstep(0.62,0.38,maria);",
  "  float limb=0.82+0.18*sqrt(max(0.,1.-d*d/(r*r)));",
  "  float glow=exp(-d*mix(14.0,9.0,br)*(1.0-0.12*tc))*(0.6+0.4*br+0.15*tc);",
  "  float halo=exp(-d*3.2)*0.009;",
  "  vec3 sky=col+moonCol*(glow*0.040+halo);",
  "  vec3 moon=moonCol*disc*0.26*tex*limb;",
  // 雲:大小の形が重なった縁。1〜2分で月の前を横切り、形もゆっくり変わる
  "  vec2 cp=vec2(uv.x*asp*1.2+t*0.0075, uv.y*5.0);",
  "  vec2 warp=vec2(fbm(cp*0.8+vec2(t*0.003,0.)),fbm(cp*0.8+vec2(5.2,1.3)-vec2(0.,t*0.002)));",
  "  float cl=fbm7(cp+warp*1.1,uDetail);",
  "  float cov=0.47;",
  "  float edge=mix(0.16,0.07,uDetail);",
  "  float cA=smoothstep(cov,cov+edge,cl)*0.92*smoothstep(0.0,0.20,h);",
  "  float thin=smoothstep(cov+edge*2.5,cov,cl);",
  "  float lit=exp(-d*3.0);",
  "  vec3 cloudCol=vec3(0.0060,0.0040,0.0034)*(0.7+0.6*fbm(cp*3.0))+moonCol*(lit*0.035+exp(-d*11.0)*0.07)*(0.35+0.65*thin);",
  "  col=sky+moon*(1.0-cA*0.75);",
  "  col=mix(col,cloudCol+moon*0.25*(1.0-cA),cA);",
  "  float mist=exp(-h*9.0)*(0.6+0.4*fbm(vec2(uv.x*asp*2.0-t*0.008,h*6.0)));",
  "  col+=vec3(0.010,0.0062,0.0042)*mist*(0.6+0.4*exp(-abs(q.x)*3.0));",
  " } else {",
  "  float dz=hz-uv.y;",
  "  vec3 d=normalize(vec3((uv.x-0.5)*asp*CK,(uv.y-hz)*CK,1.0));",       // 目から水面への向き
  "  vec3 m=normalize(vec3((moonPos.x-0.5)*asp*CK,(moonPos.y-hz)*CK,1.0));", // 月の向き(空に描いた月と同じ位置)
  "  float tt=CH/max(-d.y,1e-4); vec2 P=vec2(d.x,d.z)*tt;",                  // 水面上の位置(m)
  "  float pixA=CK/uRes.y; float fp=tt*pixA/max(-d.y,0.02);",                 // 1画素が水面で何mか(奥行き方向)
  "  float tw=t*uTS; float lost;",
  "  vec3 wv=waveSum(P,tw,fp,lost);",
  "  vec2 slE=wv.yz;",
  // 触った所から広がる波紋(前の試作と同じ広がり方)
  "  float rw=0.0;",
  "  for(int i=0;i<32;i++){",
  "   vec3 r=uRip[i]; float age=t-r.z; if(r.z<0.0||age<0.0||age>4.5) continue;",
  "   float nS=clamp((hz-r.y)/hz,0.,1.);",
  "   vec2 dq=uv-r.xy; dq.x*=asp; dq.y/=mix(0.32,0.58,nS);",
  "   float dist=length(dq); float sc=mix(0.55,1.0,nS);",
  "   float front=age*0.05*sc;",
  "   float band=exp(-pow((dist-front)/(0.028*sc),2.0))*step(dist,front+0.02*sc);",
  "   float fade=exp(-age*0.75)*smoothstep(0.0,0.12,age);",
  "   rw+=band*fade*sin((dist-front)/(0.0075*sc));",
  "  }",
  "  slE.y+=0.05*rw;",
  "  float sig20=uSig+lost; float sig2=sig20*(1.0+uWA*uBrE); float sig=sqrt(sig2);",
  "  vec3 n=normalize(vec3(-slE.x,1.0,-slE.y));",
  "  float cv=max(dot(-d,n),0.0);",
  // 空の映り込み(水平線ほど強く映る)
  "  vec3 rr=reflect(d,n); float re=max(rr.y,0.0);",
  "  vec3 skyR=mix(vec3(0.0060,0.0034,0.0030)+vec3(0.010,0.0062,0.0042)*0.6,vec3(0.0009,0.0008,0.0013),pow(clamp(re*3.0,0.0,1.0),0.6));",
  "  vec3 sea=fresnelW(cv)*skyR*0.9+vec3(0.0005,0.00045,0.0006);",
  // 月を映すのに必要な傾き(うねりで傾いた分を引く)
  "  vec3 hv=normalize(m-d); vec2 sreq=vec2(-hv.x/hv.y,-hv.z/hv.y)-slE;",
  "  float Fm=fresnelW(dot(-d,hv));",
  "  float dlt=0.022;",
  "  float s2=sig2+dlt*dlt;",
  "  float smoothG=(dlt*dlt/s2)*exp(-dot(sreq,sreq)/(2.0*s2));",              // 光の点を平均した明るさ=なめらかな光の道
  // 光の点(水面上0.35mのマス)。遠くで1マスが3画素より小さくなったら、なめらかな道に切りかえる
  "  float lv=log2(max(fp*9.0,0.01)/0.01); float l0=floor(lv); float lf=lv-l0;",   // 1マス約9画素になる大きさを選び、2段階をなめらかにつなぐ
  "  float tl=t/uLife; float sl0=floor(tl); float fr=tl-sl0; fr=fr*fr*(3.0-2.0*fr);",
  "  float gl=0.0;",
  "  for(int q=0;q<2;q++){",
  "   float cs=0.01*exp2(l0+float(q)); vec2 cp2=P/cs+float(q)*31.7; vec2 ci=floor(cp2); vec2 cf=fract(cp2)-0.5;",
  "   vec2 jit=hash2(ci+7.7)-0.5; vec2 off=cf-jit*0.5;",
  "   float shape=exp(-dot(off,off)/(2.0*0.08*0.08))/(2.0*3.1416*0.08*0.08);",
  "   float g1=mix(glitCell(ci,sl0,sreq,sig,dlt),glitCell(ci,sl0+1.0,sreq,sig,dlt),fr)*shape;",
  "   gl+=g1*(q==0?1.0-lf:lf);",
  "  }",
  "  float msk=smoothstep(0.42,0.68,noise(P*vec2(0.5,0.25)+vec2(3.1,-t*0.06))*0.7+noise(P*vec2(1.1,0.55)+vec2(-t*0.05,1.7))*0.3);",
  "  float mk=mix(1.0,msk*3.0,uMot); float gt=min(1.0,uBrE*mk); float lX=mix(uLife,1.0,uTW); float cX=mix(1.0,0.7,uTW);",
  "  float glX=glitLayer(P,l0,lf,t,lX,5.3,cX,sreq,sig,dlt,gt,min(uK,1.0))+glitLayer(P,l0,lf,t,lX,2.1,cX,sreq,sig,dlt,gt,clamp(uK-1.0,0.0,1.0))+glitLayer(P,l0,lf,t,lX,7.7,cX,sreq,sig,dlt,gt,clamp(uK-2.0,0.0,1.0));",
"  float cs=0.01*exp2(l0);",
  "  float lod=smoothstep(0.6,0.15,fp/max(-d.y,0.02)*0.0+fp/2.5)*uSpk;",
  "  float stk=noise(vec2(P.x/(cs*14.0)+t*0.01,P.y/(cs*1.2)+0.3*sin(P.x/(cs*9.0))));",
  "  float streak=smoothstep(0.35,0.85,stk)*2.2;",
  "  float G=mix(smoothG*mix(1.0,streak,smoothstep(0.0,0.6,1.0-lod)),gl+glX,lod);",
  "  G*=(sig2+dlt*dlt)/(sig20+dlt*dlt);",
  "  float hzFade=smoothstep(0.0,0.012,dz);",
  "  vec3 moonL=moonCol*uExp*Fm/max(4.0*max(cv,0.22)*pow(hv.y,4.0),0.05);",
  "  vec3 refl=moonL*G*hzFade;",
  "  float capL=0.26*0.55; refl=refl/(1.0+refl/(moonCol*capL));",
  "  vec2 sreq0=vec2(-hv.x/hv.y,-hv.z/hv.y); float s2w=uSig*3.0+lost+dlt*dlt; float glowG=(dlt*dlt/s2w)*exp(-dot(sreq0,sreq0)/(2.0*s2w));",
  "  vec3 gwl=moonL*glowG*hzFade*uGW*uBrE; gwl=gwl/(1.0+gwl/(moonCol*capL*0.5)); refl+=gwl*clamp(1.0-refl.r/(moonCol.r*capL),0.0,1.0);",
  "  col=sea+refl*(1.0+uBrA*uBrE);",
  "  col+=moonCol*0.011*max(0.0,rw)*hzFade;",
  "  col+=vec3(0.010,0.0062,0.0042)*exp(-dz*40.0)*0.45;",                    // 水平線のもや
  " }",
  " float vig=smoothstep(1.3,0.3,length((uv-vec2(0.5,0.6))*vec2(asp,1.0)));",
  " col*=mix(0.6,1.0,vig);",
  " col*=uDim;",
  " col*=0.55;",
  " col=pow(max(col,0.0),vec3(0.4545));",
  " float n=hash(frag+fract(t*0.731))+hash(frag*1.37-fract(t*0.517))-1.0;",
  " col+=n/255.0;",
  " gl_FragColor=vec4(col,1.0);",
  "}"].join("\n");
  function sh(type,src){ var s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
  var pr=gl.createProgram(); gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS)); gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));
  gl.linkProgram(pr); gl.useProgram(pr);
  var buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  var loc=gl.getAttribLocation(pr,"p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  var U={}; ["uRes","uTime","uBreath","uDim","uCalm","uTouch","uUser","uTex","uStar","uCloud","uMist","uSpark","uPop","uDetail","uGustAmp","uSwell","uSK","uSV","uST","uExA","uTe","uBS","uBA","uBrE","uBrA","uTS","uLife","uSig","uSpk","uExp","uRip","uWA","uG0","uG1","uG2","uG3","uG4","uG5","uK","uSp","uGW","uTW","uMot"].forEach(function(n){U[n]=gl.getUniformLocation(pr,n);});
  var scale=Math.min(window.devicePixelRatio||1,2);
  function resize(){ var w=Math.round(canvas.clientWidth*scale),h=Math.round(canvas.clientHeight*scale); if(!w||!h) return; if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h);} }
  addEventListener("resize",resize); if(window.visualViewport) visualViewport.addEventListener("resize",resize); resize();

  var LEVELS={1:[1,0,0,0.5,0.6,0],2:[1,0.6,0.6,0.8,0.85,0],3:[1,1,1,1,1,0],4:[1,1,1,1,1,1]};   // 月の模様,星,雲,霧,光の粒
  var LV=LEVELS[3]; var DET=parseFloat(P.get("detail")||"0.5"); var GUST=parseFloat(P.get("gust")||"0"); var EXA=-1, EXTE=0; window.setExh=function(a,te){EXA=a;EXTE=te;}; var SWELL=0; var SPR=0, KST=parseFloat(P.get("k")||"2"), GWV=parseFloat(P.get("gw")||"0.5");
  var gustHist=[]; function gustPush(v){ gustHist.push(v); if(gustHist.length>40) gustHist.shift(); }
  function gustDelay(sec){ var k=gustHist.length-1-Math.round(sec*10); return k>=0?gustHist[k]:0; }
  var ripArr=new Float32Array(96); for(var ri=0;ri<32;ri++) ripArr[ri*3+2]=-1; var ripN=0, ripLast=-9;
  function addRipple(cx,cy,t){            // cx,cy: 画面上の位置(左上0〜1)。水面より上なら何もしない
    var uy=1-cy, hz=0.56; if(uy>=hz-0.01) return;
    var k=(ripN++%32)*3; ripArr[k]=cx; ripArr[k+1]=uy; ripArr[k+2]=t; }
  function draw(t,guide,user,dim,touch){
    gl.uniform1f(U.uTex,LV[0]); gl.uniform1f(U.uStar,LV[1]); gl.uniform1f(U.uCloud,LV[2]); gl.uniform1f(U.uMist,LV[3]); gl.uniform1f(U.uSpark,LV[4]); gl.uniform1f(U.uPop,LV[5]); gl.uniform1f(U.uDetail,DET); gl.uniform1f(U.uGustAmp,GUST); gl.uniform1f(U.uSwell,SWELL); gl.uniform1f(U.uSK,parseFloat(P.get("sk")||"38")); gl.uniform1f(U.uSV,parseFloat(P.get("sv")||"5")); gl.uniform1f(U.uExA,EXA); gl.uniform1f(U.uBS,window.PICK.bs); gl.uniform1f(U.uBA,parseFloat(P.get("ba")||"1")); var BRT=parseFloat(P.get("ti")||"1.6"); var bre=(window.MICBR!=null)?window.MICBR:0; if(window.MICBR==null&&EXA>=0&&EXTE>0){ var q; if(EXA<=EXTE){q=EXA/EXTE; bre=q*q*(3-2*q);} else if(EXA<=EXTE+BRT){q=(EXA-EXTE)/BRT; bre=1-q*q*(3-2*q);} } var TAU=parseFloat(P.get("tau")||(CAPTURE?"0":"1.5")); if(TAU>0){ var dtt=Math.max(0,t-(window._lt==null?t:window._lt)); window._lt=t; window._ag=Math.max(bre,(window._ag||0)*Math.exp(-dtt/TAU)); bre=window._ag; } if(bre<0.01) SPR=0; else SPR=Math.max(SPR,bre); gl.uniform1f(U.uBrE,bre); gl.uniform1f(U.uSp,SPR); if(!CAPTURE){ KST=[0,1,2,3][window.PICK.lv]; GWV=[0,0.3,0.8,1.6][window.PICK.lv]; } gl.uniform1f(U.uK,KST); gl.uniform1f(U.uGW,GWV); gl.uniform1f(U.uTW,parseFloat(P.get("tw")||"0")); gl.uniform1f(U.uMot,parseFloat(P.get("mot")||"0")); gl.uniform1f(U.uBrA,window.PICK.bra); gl.uniform1f(U.uTS,window.PICK.ts); gl.uniform1f(U.uLife,window.PICK.life); gl.uniform1f(U.uSig,window.PICK.sig); gl.uniform1f(U.uSpk,window.PICK.spk); gl.uniform1f(U.uExp,window.PICK.exp); gl.uniform1f(U.uWA,window.PICK.wa); gl.uniform3fv(U.uRip,ripArr); gl.uniform1f(U.uTe,EXTE); gl.uniform1f(U.uST,parseFloat(P.get("st")||"0.22")); for(var gi=0;gi<6;gi++) gl.uniform1f(U["uG"+gi],gustDelay(gi*0.5));
    gl.uniform2f(U.uRes,canvas.width,canvas.height); gl.uniform1f(U.uTime,t); gl.uniform1f(U.uBreath,guide);
    gl.uniform1f(U.uDim,dim); gl.uniform1f(U.uCalm,calmValue(t)); gl.uniform1f(U.uTouch,touch); gl.uniform1f(U.uUser,user);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }

  // 画面に出す「あなたの息」:拾った音にゆっくり寄り添う(パッと反応させない)
  var userShown=0, userWeight=0, gustAcc=0;
  function followUser(env,dt){
    var w = (Sensor.on && (Sensor.conf>0.35 || Sensor.snr>2.5)) ? 1 : 0;   // 息の音がはっきり聞こえている時だけ
    userWeight += (w-userWeight)*Math.min(1,dt/(w>userWeight?1.5:6));      // 出る時は1.5秒、消える時は6秒かけて
    userShown += (env-userShown)*Math.min(1,dt/0.6);
    gustAcc+=dt; while(gustAcc>=0.1){ gustAcc-=0.1; gustPush(userShown*userWeight); }   // 0.1秒ごとに「風」の強さを記録
    return userShown*userWeight + 0.35*(1-userWeight);
  }

  window.NEMU={Sensor:Sensor,Pacer:Pacer};

  if(CAPTURE){
    // 確認用:疑似の人の息で、時刻を少しずつ進めながら描く
    var simT=0, simPhase=0, simPeriod=60/14;
    window.capStep=function(dt){
      simT+=dt;
      // 疑似の人:見本より少し遅れて、見本の速さに近づいていく
      if(simT>60) simPeriod += (Pacer.period - simPeriod)*Math.min(1,dt/25);
      simPhase+=dt/simPeriod; var f=simPhase%1;
      var amp = f<IN ? 0.35*Math.sin(Math.PI*f/IN) : 1.0*Math.sin(Math.PI*(f-IN)/(1-IN));   // 吸う音は小さく、吐く音は大きく
      var r = 0.002 + 0.02*Math.max(0,amp) + 0.0008*Math.random();
      Sensor.feed(r,dt);
      Pacer.step(dt, Sensor.period, Sensor.conf);
      return {t:simT, guidePeriod:Pacer.period, userPeriod:Sensor.period, conf:Sensor.conf, mode:Pacer.mode, env:Sensor.env};
    };
    window.capDraw=function(){ resize(); draw(simT, Pacer.value(), userShown*userWeight+0.35*(1-userWeight), dimValue(simT), 0); return true; };
    window.capFollow=function(dt){ return followUser(Sensor.env,dt); };
    Pacer.begin(true); Sensor.on=true;   // 確認用:疑似の息をマイクの代わりに使う
    window.setGust=function(a){ gustHist=a.slice(); };
    window.renderAt=function(t,user){ resize(); draw(t, 0.6, user==null?0.6:user, 1, 0); return true; };
    window.nemuReady=true;
    return;
  }

  var startEl=document.getElementById("start");
  var DEBUG=P.get("debug")==="1", dbgEl=document.getElementById("dbg");
  var started=false, t0=null, last=null, touch=0, touchTarget=0, wake=null;
  function begin(){
    if(started) return; started=true;
    startEl.style.opacity="0";
    if(navigator.wakeLock&&navigator.wakeLock.request){ navigator.wakeLock.request("screen").then(function(w){wake=w;}).catch(function(){}); }
    Sensor.start();
  }
  var curT=0, dragging=false;
  function rip(e){ var r=canvas.getBoundingClientRect(); if(curT-ripLast<0.08) return; ripLast=curT; addRipple((e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height,curT); }
  canvas.addEventListener("pointerdown",function(e){ e.preventDefault(); touchTarget=1; var was=started; begin(); dragging=true; if(was){ ripLast=-9; rip(e); } });
  canvas.addEventListener("pointermove",function(e){ if(dragging&&started) rip(e); });
  addEventListener("pointerup",function(){ dragging=false; });
  addEventListener("pointerup",function(){touchTarget=0;}); addEventListener("pointercancel",function(){touchTarget=0;});
  if(TEST) begin();

  function frame(now){
    if(last===null) last=now;
    var dt=Math.min(0.05,(now-last)/1000); last=now;
    touch += (touchTarget-touch)*Math.min(1,dt*2.5);
    if(!started){ draw(now/1000*0.2, 0.15, 0, 0.55, touch); requestAnimationFrame(frame); return; } // 始める前:静かに薄く
    if(t0===null) t0=now;
    resize();
    var t=(now-t0)/1000; curT=t;
    Sensor.update(dt);
    var tgt=Sensor.on?Sensor.env:0; var mb=window.MICBR||0;
    mb += (tgt-mb)*Math.min(1, dt/(tgt>mb?0.6:1.2));   // 吐く間にゆっくり明るく、止まるとゆっくり戻る
    window.MICBR=mb;
    var user = 0.35;
    var dim = Math.min(1, t/4) * 0.45 + 0.55; dim = Math.min(dim, 1) * dimValue(t);   // 始めた直後はなめらかに明るく
    draw(t, 0.5, user, dim, touch);
    if(DEBUG){ dbgEl.textContent="マイク: "+Sensor.status+(Sensor.ctx?" / 音の処理: "+Sensor.ctx.state:"")+"\n音の強さ: "+(Sensor.level*1000).toFixed(2)+"  静けさ: "+(Sensor.floor*1000).toFixed(2)+"  倍率: "+Sensor.snr.toFixed(1)+"\n息の反応: "+userWeight.toFixed(2)+"  拾った速さ: "+(Sensor.period?(60/Sensor.period).toFixed(1):"-")+"回/分 ("+Sensor.conf.toFixed(2)+")\n見本: "+(60/Pacer.period).toFixed(1)+"回/分 "+Pacer.mode+"\n画面: "+canvas.width+"x"+canvas.height; }
    if(TEST && Math.floor(t)%5===0 && Math.floor(t)!==window._lastLog){ window._lastLog=Math.floor(t);
      console.log("LOG t="+t.toFixed(0)+" mode="+Pacer.mode+" guide/min="+(60/Pacer.period).toFixed(1)+" user/min="+(Sensor.period?(60/Sensor.period).toFixed(1):"-")+" conf="+Sensor.conf.toFixed(2)); }
    if(t>=SESSION){ gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT); if(wake) wake.release(); return; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  Array.prototype.forEach.call(document.querySelectorAll("#ui button"),function(b){
    b.addEventListener("pointerdown",function(e){ e.stopPropagation(); });
    b.addEventListener("click",function(){ var k=b.dataset.k; window.PICK[k]=parseFloat(b.dataset.v);
      Array.prototype.forEach.call(document.querySelectorAll('#ui button[data-k="'+k+'"]'),function(x){x.classList.toggle("on",x===b);}); });
  });
})();
</script>
